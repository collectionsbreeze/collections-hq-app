<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collections HQ</title>
<style>
  /* Collections HQ — Apple system design.
     Uses Apple's own dark-mode semantic colours (systemBlue #0A84FF, systemRed #FF453A,
     etc.), their label opacities (60% / 30% for secondary / tertiary), their fill tokens
     (rgba(120,120,128,·)) and their separator (rgba(84,84,88,.6)), with the current Liquid
     Glass material laid over an atmospheric wallpaper. Type is SF Pro via the system stack
     so it renders in the OS's own face; SF Mono for identifiers. No web fonts are loaded. */
  :root{
    /* Apple dark-mode semantic colours */
    --sys-blue:#0A84FF;   --sys-green:#30D158;  --sys-red:#FF453A;
    --sys-orange:#FF9F0A; --sys-yellow:#FFD60A; --sys-purple:#BF5AF2;
    --sys-teal:#64D2FF;   --sys-indigo:#5E5CE6; --sys-gray:#8E8E93;
    --label:#FFFFFF;
    --label-2:rgba(235,235,245,.60);
    --label-3:rgba(235,235,245,.30);
    --label-4:rgba(235,235,245,.18);
    --fill-1:rgba(120,120,128,.36);
    --fill-2:rgba(120,120,128,.32);
    --fill-3:rgba(120,120,128,.24);
    --fill-4:rgba(120,120,128,.18);
    --separator:rgba(84,84,88,.60);
    --separator-opaque:#38383A;

    /* Liquid Glass material */
    --glass:linear-gradient(160deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.07) 45%, rgba(255,255,255,.04) 100%);
    --glass-raised:linear-gradient(160deg, rgba(255,255,255,.20) 0%, rgba(255,255,255,.11) 50%, rgba(255,255,255,.06) 100%);
    --glass-blur:blur(18px) saturate(150%);
    --glass-edge:inset 0 1px 0 rgba(255,255,255,.28), inset 0 -0.5px 0 rgba(255,255,255,.06);
    --glass-shadow:0 20px 44px -18px rgba(0,0,0,.75), 0 2px 8px -2px rgba(0,0,0,.45);
    --glass-shadow-sm:0 8px 22px -12px rgba(0,0,0,.6);
    --stroke:rgba(255,255,255,.14);
    --stroke-soft:rgba(255,255,255,.08);

    /* iOS radii */
    --r-xl:26px; --r-lg:20px; --r-md:14px; --r-sm:10px; --r-pill:999px;

    /* aliases so existing inline styles and JS keep resolving */
    --ink:var(--label); --ink-soft:var(--label-2); --ink-dim:var(--label-2); --ink-faint:var(--label-3);
    --accent:var(--sys-blue); --accent-soft:rgba(10,132,255,.22); --accent-strong:#409CFF; --accent-bg:rgba(10,132,255,.22);
    --red:var(--sys-red);       --red-bg:rgba(255,69,58,.20);     --brick:var(--sys-red);   --brick-soft:rgba(255,69,58,.20);
    --amber:var(--sys-orange);  --amber-bg:rgba(255,159,10,.20);  --amber-soft:rgba(255,159,10,.20);
    --yellow:var(--sys-yellow); --yellow-bg:rgba(255,214,10,.18);
    --green:var(--sys-green);   --green-bg:rgba(48,209,88,.20);   --green-soft:rgba(48,209,88,.20);
    --blue:var(--sys-blue);     --blue-bg:rgba(10,132,255,.22);
    --purple:var(--sys-purple); --purple-bg:rgba(191,90,242,.20); --violet:var(--sys-purple); --violet-soft:rgba(191,90,242,.20);
    --gray:var(--sys-gray);     --gray-bg:rgba(142,142,147,.22);  --slate:var(--sys-gray);  --slate-soft:rgba(142,142,147,.22);
    --maroon:var(--sys-red);
    --panel:var(--glass); --panel-hover:var(--glass-raised); --panel-border:var(--stroke);
    --line:var(--separator); --line-soft:var(--stroke-soft);
    --surface:var(--glass); --surface-2:var(--glass-raised); --surface-3:var(--fill-3); --bg2:var(--glass);
    --hairline:var(--stroke); --hairline-soft:var(--stroke-soft); --mat:var(--glass); --mat-hi:var(--glass-raised); --mat-sunk:var(--fill-4);
    --edge:var(--glass-edge); --lift:var(--glass-shadow); --lift-sm:var(--glass-shadow-sm);
    --radius:var(--r-lg); --radius-sm:var(--r-md); --radius-xs:var(--r-sm); --r-card:var(--r-lg); --r-inner:var(--r-md);
    --blur:var(--glass-blur); --blur-lite:blur(12px) saturate(140%);
  }
  .cd-glass{ backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); }
  *{ box-sizing:border-box; }

  #cdApp, #cdDrawer, #cdModal{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "SF Pro", "Helvetica Neue", system-ui, sans-serif;
  }
  /* The wallpaper sits on its own fixed layer instead of on #cdApp with
     background-attachment:fixed. Attached to the scrolling element, the browser had to
     repaint four large radial gradients on every hover and scroll — that is what made the
     tables feel sticky. On its own layer it is painted once and composited thereafter. */
  #cdBackdrop{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-color:#000;
    background-image:
      radial-gradient(ellipse 1300px 800px at 0% -20%, rgba(10,132,255,.30), transparent 60%),
      radial-gradient(ellipse 1000px 700px at 100% -10%, rgba(191,90,242,.20), transparent 58%),
      radial-gradient(ellipse 1200px 900px at 70% 115%, rgba(255,159,10,.14), transparent 60%),
      radial-gradient(ellipse 900px 700px at -10% 110%, rgba(100,210,255,.12), transparent 60%);
    transform:translateZ(0);
  }
  #cdApp{
    background:transparent;
    color:var(--label);
    min-height:100vh; display:flex;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    font-size:15px; line-height:1.4; letter-spacing:-.016em;   /* SF body: 15/20, -0.24pt */
    color-scheme:dark;
  }
  /* Default text colour without the ID-level specificity that was silently overriding every
     component rule below. `:where()` carries zero specificity, so a plain class rule wins. */
  :where(#cdApp, #cdDrawer){ color:var(--label); }
  :where(#cdApp *, #cdDrawer *){ color:inherit; }

  /* SF Mono for identifiers only */
  .mono{ font-family:ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric:tabular-nums; letter-spacing:0; font-size:.94em; }

  /* Form controls take the current text colour. No !important and no -webkit-text-fill-color:
     both were forcing every button white, which hid the green "Sent" doc buttons, the blue
     inline buttons and the red delete links. */
  input, textarea, select, button{
    color:inherit; background-color:transparent;
    caret-color:var(--sys-blue); font-family:inherit; letter-spacing:inherit;
  }
  ::placeholder{ color:var(--label-3); opacity:1; }
  ::selection{ background:rgba(10,132,255,.4); }
  :focus-visible{ outline:none; box-shadow:0 0 0 3px rgba(10,132,255,.5); border-radius:var(--r-sm); }
  #cdApp ::-webkit-scrollbar{ width:10px; height:10px; }
  #cdApp ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.22); border-radius:999px; border:3px solid transparent; background-clip:content-box; }
  #cdApp ::-webkit-scrollbar-track{ background:transparent; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

  /* ---- iPadOS sidebar ---- */
  #cdNav{
    width:260px; flex:none; padding:22px 14px; height:100vh; position:sticky; top:0; overflow-y:auto;
    background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
    backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
    border-right:0.5px solid var(--stroke);
  }
  .cd-brand{ padding:8px 12px 24px; }
  .cd-brand b{ font-size:22px; font-weight:700; display:block; letter-spacing:-.026em; line-height:1.15; }
  .cd-brand span{ font-size:13px; color:var(--label-2); letter-spacing:-.008em; }
  .cd-navsec{
    font-size:13px; font-weight:400; color:var(--label-2); padding:22px 12px 6px; letter-spacing:-.008em;
    text-transform:uppercase; font-size:12px; letter-spacing:.02em;
  }
  .cd-navbtn{
    display:flex; align-items:center; gap:12px;
    padding:9px 12px; border-radius:var(--r-sm); border:none; background:transparent;
    color:var(--label); font-size:15px; font-weight:400; text-align:left; cursor:pointer;
    width:100%; font-family:inherit; letter-spacing:-.016em; margin-bottom:1px;
    transition:background .15s ease;
  }
  .cd-navicon{ width:20px; height:20px; flex:none; color:var(--sys-blue); }
  .cd-navicon svg{ width:20px; height:20px; display:block; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .cd-navbtn .cd-navdot{ display:none; }
  .cd-navbtn:hover{ background:var(--fill-4); }
  .cd-navbtn.on{ background:var(--fill-3); font-weight:500; }
  .cd-navbtn .cd-navcount{
    margin-left:auto; font-size:15px; font-variant-numeric:tabular-nums; color:var(--label-2); font-weight:400;
  }
  .cd-navbtn .cd-navcount.urgent{
    color:#FFFFFF; background:var(--sys-red); border-radius:var(--r-pill); padding:1px 8px;
    font-weight:500; font-size:13px; min-width:22px; text-align:center;
  }

  /* ---- Main ---- */
  #cdMain{ flex:1; min-width:0; padding:38px 40px 90px; max-width:1320px; }
  .cd-h1{ font-size:34px; font-weight:700; margin:0 0 6px; letter-spacing:-.037em; line-height:1.18; }   /* Large Title */
  .cd-sub{ font-size:15px; color:var(--label-2); margin:0 0 28px; max-width:70ch; }

  /* ---- Glass card ---- */
  .cd-panel{
    background:var(--glass);
    backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
    border:0.5px solid var(--stroke); border-radius:var(--r-lg);
    padding:0 20px 18px; margin-bottom:20px;
    box-shadow:var(--glass-edge), var(--glass-shadow);
  }
  .cd-panel h3{
    font-size:20px; font-weight:700; letter-spacing:-.026em;   /* Title 3 */
    margin:0 -20px 14px; padding:18px 20px 14px;
  }
  .cd-panel > div:first-child > h3{ margin:0; padding:0; }
  .cd-panel > div:first-child{ margin:0 -20px 14px; padding:18px 20px 12px; }
  .cd-caption{ font-size:13px; color:var(--label-2); margin:-6px 0 14px; max-width:78ch; }
  .cd-empty{ color:var(--label-3); font-size:15px; padding:34px 0; text-align:center; }

  /* ---- Banner ---- */
  .cd-nagbanner{
    background:rgba(255,69,58,.18); border:0.5px solid rgba(255,69,58,.35);
    border-radius:var(--r-md); padding:14px 18px; margin-bottom:14px;
    display:flex; align-items:center; gap:10px; cursor:pointer; font-size:15px;
    transition:background .15s ease;
  }
  .cd-nagbanner b{ color:var(--sys-red); font-weight:600; }
  .cd-nagbanner:hover{ background:rgba(255,69,58,.26); }

  /* ---- Chips as iOS filter capsules ---- */
  .cd-chiprow{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .cd-chip{
    display:flex; align-items:center; gap:8px; padding:8px 16px; border-radius:var(--r-pill);
    background:var(--fill-3); border:none; font-size:15px; font-weight:400;
    cursor:pointer; white-space:nowrap; color:var(--label);
    transition:background .15s ease;
  }
  .cd-chip:hover{ background:var(--fill-2); }
  .cd-chip.on{ background:var(--label); color:#000; font-weight:500; }
  .cd-chip.on *{ color:inherit; }
  .cd-chip b{ font-variant-numeric:tabular-nums; font-weight:500; }
  .cd-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }

  /* ---- Tables ---- */
  .cd-table{ width:100%; border-collapse:separate; border-spacing:0; font-size:15px; }
  .cd-table th{
    text-align:right; font-size:13px; font-weight:400; color:var(--label-2);
    padding:16px 16px 12px; border-bottom:0.5px solid var(--separator);
    white-space:nowrap; cursor:pointer; user-select:none; letter-spacing:-.008em;
  }
  .cd-table th:first-child, .cd-table th:nth-child(2){ text-align:left; }
  .cd-table th:hover{ color:var(--label); }
  .cd-table td{
    text-align:right; padding:14px 16px; border-bottom:0.5px solid var(--separator);
    vertical-align:middle; font-variant-numeric:tabular-nums;
  }
  .cd-table td:first-child, .cd-table td:nth-child(2){ text-align:left; }
  .cd-table tbody tr{ cursor:pointer; }
  .cd-table tbody tr:hover td{ background:var(--fill-4); }
  .cd-table tbody tr:last-child td{ border-bottom:none; }
  .cd-namecell b{ display:block; font-size:15px; font-weight:500; letter-spacing:-.016em; }
  .cd-namecell > span{
    display:block; font-size:12px; color:var(--label-2); margin-top:2px;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; letter-spacing:0;
  }
  .cd-sortarrow{ margin-left:5px; color:var(--sys-blue); }
  .cd-flagpill{
    display:inline-block; font-size:12px; font-weight:500; background:rgba(255,159,10,.2);
    color:var(--sys-orange); padding:2px 9px; border-radius:var(--r-pill); margin-left:8px; vertical-align:middle;
  }

  /* ---- Badges: iOS tinted capsules ---- */
  .cd-badge{
    display:inline-block; padding:4px 11px; border-radius:var(--r-pill);
    font-size:13px; font-weight:500; white-space:nowrap; letter-spacing:-.008em;
  }
  .cd-pctbar{
    display:inline-block; width:56px; height:6px; border-radius:999px;
    background:var(--fill-3); overflow:hidden; vertical-align:middle; margin-right:10px;
  }
  .cd-pctbar i{ display:block; height:100%; border-radius:999px; background:var(--sys-blue); }

  .cd-toolbar{ margin-bottom:18px; }
  .cd-search{
    background:var(--fill-3); border:none; border-radius:var(--r-sm);
    padding:9px 14px; font-size:15px; width:100%; max-width:380px;
    transition:background .15s ease;
  }
  .cd-search:focus{ outline:none; background:var(--fill-2); box-shadow:0 0 0 3px rgba(10,132,255,.45); }

  /* ---- Buttons ---- */
  .cd-savebtn{
    background:var(--sys-blue); color:#FFFFFF; border:none; border-radius:var(--r-pill);
    padding:10px 20px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit;
    letter-spacing:-.016em; transition:filter .15s ease, transform .1s ease;
  }
  .cd-savebtn:hover{ filter:brightness(1.08); }
  .cd-savebtn:active{ transform:scale(.97); }
  .cd-savebtn:disabled{ opacity:.4; cursor:default; }
  .cd-savebtn.secondary{ background:rgba(10,132,255,.22); color:var(--sys-blue); }
  .cd-savebtn.secondary:hover{ background:rgba(10,132,255,.3); filter:none; }
  .cd-saveok{ display:none; font-size:13px; color:var(--sys-green); margin-left:10px; }

  /* ---- Grouped list rows with disclosure chevron ---- */
  .cd-listrow{
    display:flex; justify-content:space-between; align-items:center; gap:14px;
    padding:13px 34px 13px 14px; margin:0 -14px; position:relative;
    border-bottom:0.5px solid var(--separator); font-size:15px; cursor:pointer;
    transition:background .12s ease;
  }
  .cd-listrow::after{
    content:"\203A"; position:absolute; right:14px; top:50%; transform:translateY(-50%);
    color:var(--label-3); font-size:22px; line-height:1; font-weight:300;
  }
  .cd-listrow:hover{ background:var(--fill-4); border-radius:var(--r-sm); }
  .cd-listrow:last-child{ border-bottom:none; }
  .cd-listrow b{ font-weight:500; letter-spacing:-.016em; }
  .cd-listrow small{ color:var(--label-2); display:block; margin-top:2px; font-size:13px; }

  /* ---- KPI widgets ---- */
  .cd-kpirow{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:26px; }
  .cd-kpi{
    background:var(--glass); border:0.5px solid var(--stroke); border-radius:var(--r-lg);
    backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
    padding:18px 20px 20px; box-shadow:var(--glass-edge), var(--glass-shadow);
  }
  .cd-kpi span{ font-size:13px; color:var(--label-2); display:block; margin-bottom:8px; font-weight:500; letter-spacing:-.008em; }
  .cd-kpi b, .cd-kpi b.mono{ font-family:inherit; font-size:36px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.04em; line-height:1; }
  .cd-kpisub{ font-size:13px; color:var(--label-2); margin-top:8px; }

  /* ---- Drawer (sheet) ---- */
  #cdDrawer{
    position:fixed; top:0; right:0; width:520px; max-width:95vw; height:100vh;
    background:linear-gradient(165deg, rgba(38,44,54,.985), rgba(22,26,33,.985) 55%, rgba(17,20,26,.985));
    border-left:0.5px solid var(--stroke); transform:translateX(100%);
    will-change:transform; contain:layout paint;
    transition:transform .4s cubic-bezier(.32,.72,0,1); z-index:50; overflow-y:auto;
    padding:30px 28px 80px; box-shadow:-40px 0 100px -30px rgba(0,0,0,.9);
  }
  #cdDrawer.on{ transform:translateX(0); }
  /* Global search — lives in the sidebar, not in a modal.
     Two layouts are on trial and switch from the control at the foot of the sidebar:
       results "inline"  — the hit list drops down inside the 260px column
       results "widen"   — the whole sidebar expands while a query is active, so the
                           snippets have room to be read
     The box itself is either permanently open or a row that turns into a field on click.
     Both choices persist per browser in localStorage; neither touches state.json. */
  .cd-navsearch{ padding:0 2px 4px; }
  .cd-navsearchbar{
    display:flex; align-items:center; gap:10px;
    padding:9px 12px; border-radius:var(--r-sm);
    background:var(--fill-4); border:0.5px solid transparent;
    cursor:text; transition:background .15s ease, border-color .15s ease;
  }
  .cd-navsearchbar:hover{ background:var(--fill-3); }
  .cd-navsearchbar.focused{ background:var(--fill-3); border-color:rgba(10,132,255,.55); }
  .cd-navsearchbar svg{ width:17px; height:17px; flex:none; stroke:var(--label-3); fill:none; stroke-width:2; }
  .cd-navsearchbar.focused svg{ stroke:var(--sys-blue); }
  #cdNavSearchInput{
    flex:1; min-width:0; background:transparent; border:none; outline:none;
    color:var(--label); font-size:15px; font-family:inherit; letter-spacing:-.016em; padding:0;
  }
  #cdNavSearchInput::placeholder{ color:var(--label-3); }
  /* The global :focus-visible ring would draw a blue lozenge around the field inside the
     bar. The bar's own border already shows focus, so suppress the ring here only. */
  #cdNavSearchInput:focus, #cdNavSearchInput:focus-visible{ outline:none; box-shadow:none; }
  .cd-navsearchlabel{ flex:1; color:var(--label-2); font-size:15px; letter-spacing:-.016em; }
  .cd-navsearchclear{
    background:none; border:none; color:var(--label-3); font-size:15px; cursor:pointer;
    padding:0 2px; line-height:1; flex:none;
  }
  .cd-navsearchclear:hover{ color:var(--label); }
  .cd-navsearchcount{ font-size:12px; color:var(--label-3); white-space:nowrap; flex:none; }

  #cdNavSearchResults{ max-height:52vh; overflow-y:auto; margin-top:6px; }
  #cdNavSearchResults:empty{ display:none; }
  /* In the narrow column the hit rows have to give up some air to stay legible. */
  #cdNavSearchResults .cd-sres{ padding:8px 10px; border-radius:var(--r-sm); font-size:14px; }
  #cdNavSearchResults .cd-sres .meta{ font-size:11px; }
  #cdNavSearchResults .cd-sres .snip{ font-size:11.5px; -webkit-line-clamp:2; }
  #cdNavSearchResults .cd-sgroup{ padding:10px 10px 4px; }
  #cdNavSearchResults .cd-searchempty{ padding:14px 10px; text-align:left; font-size:12.5px; line-height:1.45; }

  /* Widen layout: the column grows while a query is live. */
  #cdNav{ transition:width .22s cubic-bezier(.32,.72,0,1); }
  #cdNav.searching-widen{ width:470px; }
  #cdNav.searching-widen #cdNavSearchResults .cd-sres{ padding:10px 14px; font-size:15px; }
  #cdNav.searching-widen #cdNavSearchResults .cd-sres .meta{ font-size:12px; }
  #cdNav.searching-widen #cdNavSearchResults .cd-sres .snip{ font-size:12.5px; -webkit-line-clamp:3; }
  #cdNav.searching-widen #cdNavSearchResults{ max-height:66vh; }
  @media (prefers-reduced-motion: reduce){ #cdNav{ transition:none; } }

  .cd-sres{
    display:block; width:100%; text-align:left; background:transparent; border:none;
    color:inherit; font:inherit; padding:10px 16px; border-radius:var(--r-md); cursor:pointer;
  }
  .cd-sres:hover, .cd-sres.sel{ background:var(--fill-3); }
  .cd-sres b{ font-weight:600; }
  .cd-sres .meta{ font-size:12px; color:var(--label-2); margin-top:2px;
    font-family:"SF Mono",ui-monospace,monospace; }
  .cd-sres .snip{ font-size:12.5px; color:var(--label-2); margin-top:3px;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .cd-sres mark{ background:rgba(10,132,255,.32); color:var(--label); border-radius:3px; padding:0 2px; }
  .cd-sgroup{ font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    color:var(--label-3); padding:12px 16px 6px; }
  .cd-searchempty{ padding:34px 20px; text-align:center; color:var(--label-2); font-size:14px; }


  #cdDrawerOverlay{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:49; display:none; }
  #cdDrawerOverlay.on{ display:block; }

  /* ---- Modal (alert sheet) ---- */
  #cdModalOverlay{ position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:59; display:none; align-items:center; justify-content:center; }
  #cdModalOverlay.on{ display:flex; }
  #cdModal{
    background:linear-gradient(165deg, rgba(40,46,56,.99), rgba(24,28,36,.99));
    border:0.5px solid var(--stroke); border-radius:var(--r-xl); padding:26px;
    width:470px; max-width:93vw; max-height:86vh; overflow-y:auto;
    box-shadow:var(--glass-edge), 0 40px 100px -24px rgba(0,0,0,.85);
  }
  #cdModal h3{ font-size:22px; font-weight:700; margin:0 0 18px; letter-spacing:-.03em; }

  /* iOS close: grey circle with ✕ */
  .cd-modalclose, .cd-drclose{

<script>
(function(){
  "use strict";
  const STORE_KEY = "collections_hq_v2";
  const DATA_VERSION = "v2-2026-09-10h";
  // Live clock. This used to be a frozen constant, which meant "today" drifted out of
  // date between sessions and reminders could never actually come due. TODAY is now
  // refreshed by a ticker (see startClock) so the app tracks real time.
  let TODAY = new Date();

  // Status palette. Deliberately desaturated: saturation itself carries urgency, so the
  // two statuses that mean "act now" are the only ones with any real chroma. Terminal
  // states are quietest of all — a resolved deal should recede, not glow.
  // Semantic pairs from the design system: bold colour on a soft tint, never a solid fill.
  const STATUS = {
    contact_today: {label:"Contact Today", color:"#FF453A", bg:"rgba(255,69,58,.20)", severity:6},
    needs_file:    {label:"Needs to Be Filed", color:"#FF453A", bg:"rgba(255,69,58,.20)", severity:5.5},
    urgent:        {label:"Urgent", color:"#FF9F0A", bg:"rgba(255,159,10,.20)", severity:5},
    legal:         {label:"Legal", color:"#BF5AF2", bg:"rgba(191,90,242,.20)", severity:5},
    in_touch:      {label:"In Touch", color:"#0A84FF", bg:"rgba(10,132,255,.22)", severity:4},
    awaiting_response: {label:"Awaiting Response", color:"#FFD60A", bg:"rgba(255,214,10,.18)", severity:3.5},
    debt_relief:   {label:"Debt Relief", color:"#BF5AF2", bg:"rgba(191,90,242,.20)", severity:3},
    monitor:       {label:"Monitor", color:"#8E8E93", bg:"rgba(142,142,147,.22)", severity:2},
    resolved:      {label:"Resolved", color:"#30D158", bg:"rgba(48,209,88,.20)", severity:0, terminal:true},
    paid_full:     {label:"Paid Full", color:"#30D158", bg:"rgba(48,209,88,.20)", severity:0, terminal:true},
    write_off:     {label:"Write Off", color:"#8E8E93", bg:"rgba(142,142,147,.22)", severity:0, terminal:true}
  };
  function statusOf(s){ return STATUS[s] || {label:s||"Unknown", color:"var(--gray)", bg:"var(--gray-bg)", severity:1, terminal:false}; }

  const CLAWBACK = {
    none:           {label:"None", color:"var(--ink-faint)"},
    at_risk:        {label:"At Risk", color:"var(--amber)"},
    needs_pull:     {label:"Needs to Be Pulled", color:"var(--red)"},
    pulled_pending: {label:"Pulled — Pending", color:"var(--blue)"},
    landed:         {label:"Landed", color:"var(--green)"},
    bounced:        {label:"Bounced — ISO Wire Needed", color:"var(--red)"}
  };

  const TASK_TYPES = {
    contact_merchant:   "Contact Merchant",
    iso_in_touch:       "ISO In Touch",
    payment_confirmation: "Payment/Wire Confirmation",
    legal_followup:     "Legal Follow-up",
    internal_followup:  "Internal Follow-up",
    settlement_compliance: "Settlement Compliance"
  };
  const WAITING_ON = {
    you: "You", david: "David", iso: "ISO", legal_firm: "Legal Firm",
    merchant: "Merchant", gabriela: "Gabriela", anusha: "Anusha"
  };

  const LEGAL_STAGES = {
    assembling_packet: {label:"Assembling Packet", track:"universal"},
    sent_to_firm: {label:"Sent to Firm", track:"universal"},
    docs_requested: {label:"Docs Requested", track:"universal"},
    confirmed_received: {label:"Confirmed Received", track:"universal"},
    payment_plan_proposed: {label:"Payment Plan Proposed", track:"madeb"},
    payment_plan_active: {label:"Payment Plan Active", track:"madeb"},
    ar_lien_freeze: {label:"AR/Lien Freeze", track:"lieberman"},
    judgment: {label:"Judgment / Further Action", track:"lieberman"},
    resolved: {label:"Resolved", track:"universal", terminal:true},
    defaulted_again: {label:"Defaulted Again", track:"madeb"}
  };
  // Broker/ISO contact registry — seeded with names already known from deal history.
  // Editable and extendable in the app (Deals drawer > broker dropdown > Add New).

  // Registry of other companies whose deals sit on our platform but aren't ours to
  // collect — same add-as-you-go pattern as brokers, picked from a dropdown instead of
  // re-typing a name each time.

  const KNOWN_FIRMS = {
    "Madeb Law": "madeb",
    "L&K Legal": "lieberman", // internal track key only — L&K is the one and only firm on this track, never a separate "Lieberman"
    "Weinstein LLP": "other",
    "Other": "other"
  };
  const LEGAL_DOC_LABELS = {
    statements: "Bank Statements", application: "Application", dlvc: "DL / Voided Check",
    ucc: "UCC Filing", wireScreenshot: "Wire Screenshot", payrunScreenshot: "Payrun Screenshot",
    pdfPayrun: "PDF Payrun", arInvoices: "AR / Invoices / CC Processor", settlementAgreement: "Settlement Agreement"
  };

  // ---- SEED DATA ----



  // Cleared 2026-09-04: the 2026-09-03 snapshot is now the baseline in SEED_*.
  // Everything previously listed here is already applied in Yaakov's live storage
  // and baked into the seeds above. New deltas get appended here going forward.
  // Inbound items only — things that ARRIVED. Never our own actions. This is the phone-
  // notifications model: a report lands, an email comes in, David sends a screenshot. Once
  // it has been read it drops off Today for good. Everything seeded here is marked read,
  // because it was all worked through on 9/8 — the list should start empty and fill with
  // whatever genuinely arrives next.


  // Conditional items: "X happens only if Y clears / fails". These have no due date of their
  // own — they hang on an outcome — which is exactly why they get forgotten. Each one names
  // the condition, what happens either way, and when to look.






  // ---- Storage helpers ----
  // The whole DB used to go into ONE key (~270KB and growing). That started failing with
  // "Internal server error while processing action" — the write was simply too big. Data is
  // now split across several smaller keys, only the parts that actually changed get written,
  // each write retries on failure, and anything that still won't save raises a visible banner
  // instead of dying silently in the console.
  // ---------------------------------------------------------------------------
  // GitHub-backed storage.
  //
  // One file, data/state.json, in a private repo. This replaces ~12KB of sharding,
  // connection pooling and rate-limit backoff, all of which existed to work around
  // window.storage limiting message count and payload size. GitHub has neither problem
  // here: one read, one write, 5,000 calls an hour, 342KB against a 100MB ceiling.
  //
  // The one piece of real complexity kept is SHA matching. Every read returns a SHA and a
  // write only lands if that SHA still matches. Without it, Yaakov saving in the browser
  // while Claude patches the same file means one side's work vanishes with no error at all.
  // ---------------------------------------------------------------------------
  const LOG_KEEP = 300;   // keep the activity log bounded so it can't grow back into the problem

  let DB = null;

  const GH_API  = "https://api.github.com";
  const GH_PATH = "data/state.json";
  const CFG_KEY = "collections_hq_gh_config";

  let ghCfg = { owner: "", repo: "", token: "" };
  let ghSha = null;
  let saveBannerEl = null;

  // Search layout, settled 9/17 after trialling the alternatives: the field is always open
  // in the sidebar, and the column widens while a query is live so snippets have room.
  let searchQuery = "";

  function ghConfigured(){ return !!(ghCfg.owner && ghCfg.repo && ghCfg.token); }

  function loadCfg(){
    try{
      const raw = localStorage.getItem(CFG_KEY);
      if(raw) ghCfg = Object.assign(ghCfg, JSON.parse(raw));
    }catch(e){ /* first run, or storage blocked */ }
  }
  function saveCfg(){
    try{ localStorage.setItem(CFG_KEY, JSON.stringify(ghCfg)); }catch(e){}
  }
  function clearCfg(){
    ghCfg = { owner:"", repo:"", token:"" };
    try{ localStorage.removeItem(CFG_KEY); }catch(e){}
  }

  function ghHeaders(){
    return { "Authorization": "Bearer " + ghCfg.token,
             "Accept": "application/vnd.github+json",
             "X-GitHub-Api-Version": "2022-11-28" };
  }

  // btoa mangles anything outside Latin-1, and this data is full of em-dashes and accented
  // merchant names. Round-tripping through UTF-8 bytes explicitly is the only safe way.
  function b64encode(str){
    const bytes = new TextEncoder().encode(str);
    let bin = "";
    for(let i=0; i<bytes.length; i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000));
    return btoa(bin);
  }
  function b64decode(b64){
    const bin = atob(String(b64).replace(/\s/g, ""));
    const bytes = new Uint8Array(bin.length);
    for(let i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function ghUrl(){
    return GH_API + "/repos/" + ghCfg.owner + "/" + ghCfg.repo + "/contents/" + GH_PATH;
  }

  async function ghFetch(url, opts, tries){
    tries = (tries == null) ? 3 : tries;
    let lastErr = null;
    for(let i=0; i<=tries; i++){
      try{
        const r = await fetch(url, opts);
        if(r.status === 401) throw {code:"bad_token", message:"GitHub rejected the token. It may have expired or been revoked."};
        if(r.status === 403){
          const body = await r.text();
          if(/rate limit/i.test(body)) throw {code:"rate_limit", message:"GitHub rate limit reached. Try again shortly."};
          throw {code:"forbidden", message:"The token can't write to this repo. It needs Contents: Read and write."};
        }
        if(r.status === 404) return { status:404 };
        if(r.status === 409 || r.status === 422) return { status:r.status };
        if(!r.ok) throw {code:"http", message:"GitHub returned " + r.status + "."};
        return { status:r.status, body: await r.json() };
      }catch(e){
        // "Failed to fetch" means the request never left the page — the browser blocked it
        // before it was sent. In practice that is a sandboxed preview or an extension, not a
        // problem with GitHub or the token, and retrying is pointless. Saying so plainly stops
        // people re-entering a token that was never the issue.
        if(e instanceof TypeError && /fetch|network/i.test(e.message || "")){
          throw {code:"blocked",
                 message:"The browser blocked the request to GitHub before it was sent. "
                       + "That usually means this page is running inside a preview or sandbox. "
                       + "Download the file and open it directly in your browser, or use the hosted URL."};
        }
        lastErr = e;
        // A bad token or missing permission will never fix itself — fail fast instead of
        // making the user wait through three retries for a certainty.
        // None of these fix themselves within a retry window. A rate limit lasts until
        // GitHub's reset (up to an hour), and a bad token or missing permission is never fixed
        // by waiting at all — so surface them immediately instead of stalling the user.
        if(e && (e.code === "bad_token" || e.code === "forbidden" || e.code === "rate_limit")) throw e;
        if(i < tries) await new Promise(res=>setTimeout(res, 600*Math.pow(2,i) + Math.random()*400));
      }
    }
    throw lastErr || {code:"unknown", message:"Couldn't reach GitHub."};
  }

  async function ghRead(){
    const r = await ghFetch(ghUrl() + "?t=" + Date.now(), { headers: ghHeaders(), cache:"no-store" });
    if(r.status === 404){ ghSha = null; return null; }
    ghSha = r.body.sha;
    try{ return JSON.parse(b64decode(r.body.content)); }
    catch(e){ throw {code:"corrupt", message:"state.json isn't valid JSON. Earlier versions are in the repo's commit history."}; }
  }

  // Returns true on success, "conflict" if someone saved since we last read, false on failure.
  // A conflict isn't an error — it's the safety net doing its job.
  async function ghWrite(state, message){
    const payload = { message: message || ("Collections HQ — " + new Date().toISOString()),
                      content: b64encode(JSON.stringify(state, null, 1)) };
    if(ghSha) payload.sha = ghSha;
    const r = await ghFetch(ghUrl(), { method:"PUT", headers: ghHeaders(), body: JSON.stringify(payload) });
    if(r.status === 409 || r.status === 422) return "conflict";
    ghSha = r.body && r.body.content && r.body.content.sha;
    return true;
  }

  function emptyDb(){
    return { deals:[], commitments:[], tasks:[], reminders:[], inbox:[], watch:[],
             brokers:[], owners:[], eventLog:[], version: DATA_VERSION,
             thresholds:{daily:3, weeklyMonthly:10}, lastReportAt:null, appliedUpdates:[] };
  }

  function normalise(db){
    const base = emptyDb();
    const out = Object.assign(base, db || {});
    ["deals","commitments","tasks","reminders","inbox","watch","brokers","owners","eventLog"]
      .forEach(k=>{ if(!Array.isArray(out[k])) out[k] = []; });
    return out;
  }

  // The search field now lives inside the sidebar, which is rebuilt on every render, so the
  // field is a new element each time and has to be rebound. Document-level keys bind once.
  function bindNavSearch(){
    const clear = document.getElementById("cdNavSearchClear");
    if(clear) clear.onclick = (e) => { e.stopPropagation(); closeSearch(); render(); };

    const bar = document.getElementById("cdNavSearchBar");
    const inp = document.getElementById("cdNavSearchInput");
    if(!inp) return;
    if(bar) bar.onclick = () => inp.focus();
    inp.onfocus = () => { if(bar) bar.classList.add("focused"); };
    inp.onblur  = () => { if(bar && !searchQuery) bar.classList.remove("focused"); };

    inp.addEventListener("input", () => {
      searchQuery = inp.value; searchSel = 0; renderSearchResults(inp.value);
    });
    inp.addEventListener("keydown", e => {
      if(e.key === "ArrowDown"){ e.preventDefault(); searchSel = Math.min(searchSel + 1, searchHits.length - 1); renderSearchResults(inp.value); scrollSel(); }
      else if(e.key === "ArrowUp"){ e.preventDefault(); searchSel = Math.max(searchSel - 1, 0); renderSearchResults(inp.value); scrollSel(); }
      else if(e.key === "Enter"){ e.preventDefault(); openSearchHit(searchHits[searchSel]); }
      else if(e.key === "Escape"){ e.preventDefault(); closeSearch(); render(); }
    });
    function scrollSel(){
      const el = document.querySelector("#cdNavSearchResults .cd-sres.sel");
      if(el) el.scrollIntoView({ block: "nearest" });
    }
    if(searchQuery) renderSearchResults(searchQuery);
  }

  (function bindGlobalSearchKeys(){
    document.addEventListener("keydown", e => {
      if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); openSearch(); }
      else if(e.key === "Escape" && searchQuery){ closeSearch(); render(); }
      else if(e.key === "/" && !/^(INPUT|TEXTAREA)$/.test((document.activeElement||{}).tagName || "")){
        e.preventDefault(); openSearch();
      }
    });
  })();

  async function load(){
    loadCfg();
    if(!ghConfigured()){ renderSetup(); return; }
    try{
      const remote = await ghRead();
      DB = normalise(remote);
      if(remote === null){
        // Repo has no state file yet — start empty and create it on first save.
        await save("Create state.json");
      }
      hideBanner();
      render();
    }catch(e){
      renderLoadError(e);
    }
  }

  let saveInFlight = null, saveQueued = false, queuedWaiters = [];

  // Coalescing is right — a burst of edits shouldn't mean a burst of writes. But a caller
  // arriving mid-save must wait for the NEXT save, not the in-flight one, because the
  // in-flight one doesn't contain their change yet.
  async function save(message){
    if(!ghConfigured()) return;
    if(saveInFlight){
      saveQueued = true;
      return new Promise(resolve => queuedWaiters.push(resolve));
    }
    saveInFlight = doSave(message);
    try{ await saveInFlight; } finally { saveInFlight = null; }
    if(saveQueued){
      saveQueued = false;
      const waiters = queuedWaiters; queuedWaiters = [];
      await save(message);
      waiters.forEach(r=>r());
    }
  }

  async function doSave(message){
    if(DB && DB.eventLog && DB.eventLog.length > LOG_KEEP) DB.eventLog = DB.eventLog.slice(-LOG_KEEP);
    DB.version = DATA_VERSION;
    DB.savedAt = new Date().toISOString();
    try{
      const r = await ghWrite(DB, message);
      if(r === "conflict"){
        // Someone else wrote since we read. Reloading is the honest response — better a
        // visible "your last change may not have saved" than a silent overwrite of theirs.
        showBanner("Someone else saved while you were editing. "
          + "<b>Reloading</b> so you don't overwrite their work \u2014 re-check your last change.", "warn");
        setTimeout(()=>location.reload(), 2600);
        return;
      }
      hideBanner();
    }catch(e){
      const msg = (e && e.message) || "Couldn't save to GitHub.";
      showBanner("<b>Not saved.</b> " + esc(msg)
        + ' <button id="cdRetrySave" style="margin-left:10px;background:rgba(255,255,255,.18);border:none;'
        + 'color:inherit;padding:4px 12px;border-radius:999px;cursor:pointer;font:inherit;">Retry</button>', "bad");
      const btn = document.getElementById("cdRetrySave");
      if(btn) btn.onclick = ()=>{ hideBanner(); save(message); };
    }
  }

  function renderLoadError(e){
    const msg = (e && e.message) || "Couldn't reach GitHub.";
    const app = document.getElementById("cdApp");
    app.innerHTML = '<div style="margin:auto;max-width:520px;padding:40px;text-align:center;">'
      + '<div class="cd-h1" style="font-size:24px;">Couldn\'t load your data</div>'
      + '<p class="cd-sub" style="margin:10px 0 22px;">' + esc(msg) + '</p>'
      + '<button class="cd-savebtn" id="cdRetryLoad">Try again</button> '
      + '<button class="cd-savebtn secondary" id="cdReconfig">Change settings</button></div>';
    document.getElementById("cdRetryLoad").onclick = ()=>load();
    document.getElementById("cdReconfig").onclick = ()=>{ clearCfg(); renderSetup(); };
  }

  // First run on a device. Deliberately its own screen rather than a prompt() \u2014 those are
  // blocked in some contexts and give no room to explain what the token is for.
  function renderSetup(err){
    const app = document.getElementById("cdApp");
    app.innerHTML = '<div style="margin:auto;max-width:460px;padding:40px 24px;">'
      + '<div class="cd-h1" style="font-size:26px;">Connect to GitHub</div>'
      + '<p class="cd-sub" style="margin:8px 0 24px;">Your data lives in a private repo. '
      + 'These details are stored in this browser only \u2014 never in the app itself.</p>'
      + (err ? '<div class="cd-warn">' + esc(err) + '</div>' : '')
      + '<div class="cd-formrow"><label>GitHub username</label>'
      + '<input class="cd-input" id="cfgOwner" placeholder="collectionsbreeze" value="' + esc(ghCfg.owner||"") + '"></div>'
      + '<div class="cd-formrow"><label>Repository name</label>'
      + '<input class="cd-input" id="cfgRepo" placeholder="Collections-HQ" value="' + esc(ghCfg.repo||"Collections-HQ") + '"></div>'
      + '<div class="cd-formrow"><label>Access token</label>'
      + '<input class="cd-input" id="cfgToken" type="password" placeholder="github_pat_..."></div>'
      + '<button class="cd-savebtn" id="cfgSave" style="margin-top:8px;">Connect</button>'
      + '<div id="cfgStatus" class="cd-sub" style="margin-top:14px;"></div></div>';
    document.getElementById("cfgSave").onclick = async ()=>{
      const owner = document.getElementById("cfgOwner").value.trim();
      const repo  = document.getElementById("cfgRepo").value.trim();
      const token = document.getElementById("cfgToken").value.trim();
      const status = document.getElementById("cfgStatus");
      if(!owner || !repo || !token){
        status.textContent = "All three are needed.";
        ["cfgOwner","cfgRepo","cfgToken"].forEach(id=>{
          const el = document.getElementById(id);
          el.style.borderColor = el.value.trim() ? "" : "var(--sys-red)";
        });
        return;
      }
      status.textContent = "Checking\u2026";
      ghCfg = { owner, repo, token };
      try{
        await ghRead();          // proves the token can actually see the file
        saveCfg();
        status.textContent = "Connected. Loading\u2026";
        await load();
      }catch(e){
        ghCfg = { owner:"", repo:"", token:"" };
        status.innerHTML = '<span style="color:var(--sys-red);">' + esc((e && e.message) || "Couldn't connect.") + '</span>';
      }
    };
  }

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  function money(v){ v = Math.round(v||0); return "$"+v.toLocaleString("en-US"); }
  function moneyDec(v){ return "$"+(v||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function fmtDate(d){ if(!d) return "—"; const dt = typeof d==="string"?new Date(d+"T12:00:00Z"):d; return dt.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }
  function fmtDateShort(d){ if(!d) return "—"; const dt = typeof d==="string"?new Date(d+"T12:00:00Z"):d; return dt.toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
  function daysBetween(a,b){ return Math.round((b-a)/86400000); }
  function daysUntil(dateStr){ if(!dateStr) return null; const d = new Date(dateStr+"T12:00:00Z"); return daysBetween(TODAY, d); }
  function pct(rec, orig){ if(!orig) return 0; return Math.min(100, Math.max(0, (rec/orig)*100)); }
  // Local calendar date, not UTC — after 8pm Eastern a UTC date is already tomorrow,
  // which would make "today" wrong for most of the working evening.
  function localDateStr(d){
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function todayStr(){ return localDateStr(TODAY); }
  function nowStamp(){ return localDateStr(TODAY)+"T"+String(TODAY.getHours()).padStart(2,"0")+":"+String(TODAY.getMinutes()).padStart(2,"0"); }
  function fmtTime(hhmm){
    if(!hhmm) return "";
    const [h,m] = hhmm.split(":").map(Number);
    const ap = h<12?"AM":"PM"; const h12 = h%12===0?12:h%12;
    return h12+":"+String(m).padStart(2,"0")+" "+ap;
  }
  function splitDueAt(dueAt){
    if(!dueAt) return {date:null, time:null};
    const [date, time] = dueAt.split("T");
    return {date, time: time || null};
  }
  function fmtDueAt(dueAt){
    const {date,time} = splitDueAt(dueAt);
    return fmtDateShort(date) + (time ? " at " + fmtTime(time) : "");
  }
  function dueAtPassed(dueAt){
    if(!dueAt) return false;
    return dueAt <= nowStamp();
  }
  function relativeDue(dueAt){
    const mins = Math.round((new Date(dueAt.replace("T"," ").replace(/-/g,"/")) - TODAY)/60000);
    const a = Math.abs(mins);
    const unit = a<60 ? a+" min" : a<1440 ? Math.round(a/60)+" hr" : Math.round(a/1440)+" day"+(Math.round(a/1440)===1?"":"s");
    return mins<0 ? unit+" ago" : "in "+unit;
  }
  function isoDaysAgo(dateStr){ if(!dateStr) return null; const d = new Date(dateStr+"T12:00:00Z"); return daysBetween(d, TODAY); }
  function uid(prefix){ return prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7); }

  // ---------------- MINI CALENDAR DATE PICKER ----------------
  // Custom component instead of native <input type="date"> — guaranteed to actually
  // open when clicked, and matches the app's own look instead of the OS picker.
  let datePickerOpenFor = null;
  let datePickerValues = {};
  let datePickerMonth = {};

  function dateFieldHtml(key){
    const val = datePickerValues[key] || "";
    const displayVal = val ? fmtDateShort(val) : "Select date";
    let html = '<button type="button" class="cd-select cd-datebtn" data-datetoggle="'+key+'" style="justify-content:space-between;align-items:center;color:'+(val?'var(--ink)':'var(--ink-faint)')+';">'+esc(displayVal)+'<span></span></button>';
    if(datePickerOpenFor===key) html += miniCalendarHtml(key);
    return html;
  }

  function miniCalendarHtml(key){
    if(!datePickerMonth[key]){
      const base = datePickerValues[key] ? new Date(datePickerValues[key]+"T12:00:00Z") : TODAY;
      datePickerMonth[key] = {y: base.getUTCFullYear(), m: base.getUTCMonth()};
    }
    const anchor = datePickerMonth[key];
    const first = new Date(Date.UTC(anchor.y, anchor.m, 1));
    const startDow = first.getUTCDay();
    const daysInMonth = new Date(Date.UTC(anchor.y, anchor.m+1, 0)).getUTCDate();
    const label = first.toLocaleDateString("en-US",{month:"long",year:"numeric",timeZone:"UTC"});
    let cells = "";
    for(let i=0;i<startDow;i++) cells += "<div></div>";
    for(let day=1; day<=daysInMonth; day++){
      const ds = anchor.y+"-"+String(anchor.m+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
      const isSel = ds===datePickerValues[key];
      const isToday = ds===todayStr();
      cells += '<button type="button" class="cd-minicalday'+(isSel?' sel':'')+(isToday&&!isSel?' today':'')+'" data-datepick="'+key+'|'+ds+'">'+day+'</button>';
    }
    return '<div class="cd-minical">'
      + '<div class="cd-minicalhead"><button type="button" data-dateminicalmove="'+key+'|-1">‹</button><b>'+label+'</b><button type="button" data-dateminicalmove="'+key+'|1">›</button></div>'
      + '<div class="cd-minicalgrid">' + ["S","M","T","W","T","F","S"].map(d=>'<div class="cd-minicaldow">'+d+'</div>').join("") + cells + '</div>'
      + '</div>';
  }

  // Time picker built from plain selects — native <input type="time"> is as unreliable
  // here as <input type="date">, so it gets the same treatment as the mini calendar.
  let timePickerValues = {};
  function timeFieldHtml(key, dflt){
    const val = timePickerValues[key] || dflt || "16:00";
    timePickerValues[key] = val;
    const [h,m] = val.split(":");
    let hopts = "", mopts = "";
    for(let i=0;i<24;i++){
      const hh = String(i).padStart(2,"0");
      const lab = (i%12===0?12:i%12)+" "+(i<12?"AM":"PM");
      hopts += '<option value="'+hh+'"'+(hh===h?' selected':'')+'>'+lab+'</option>';
    }
    ["00","15","30","45"].forEach(mm=>{
      mopts += '<option value="'+mm+'"'+(mm===m?' selected':'')+'>:'+mm+'</option>';
    });
    return '<div class="cd-timesel"><select data-timehour="'+key+'">'+hopts+'</select>'
      + '<select data-timemin="'+key+'">'+mopts+'</select></div>';
  }
  function wireTimePickers(){
    document.querySelectorAll("[data-timehour]").forEach(s=>s.onchange=()=>{
      const k=s.dataset.timehour; const m=(timePickerValues[k]||"16:00").split(":")[1];
      timePickerValues[k] = s.value+":"+m;
    });
    document.querySelectorAll("[data-timemin]").forEach(s=>s.onchange=()=>{
      const k=s.dataset.timemin; const h=(timePickerValues[k]||"16:00").split(":")[0];
      timePickerValues[k] = h+":"+s.value;
    });
  }

  function wireDatePickers(rerenderFn){
    document.querySelectorAll("[data-datetoggle]").forEach(b=>b.onclick=(e)=>{
      e.preventDefault();
      const key = b.dataset.datetoggle;
      datePickerOpenFor = datePickerOpenFor===key ? null : key;
      rerenderFn();
    });
    document.querySelectorAll("[data-datepick]").forEach(b=>b.onclick=(e)=>{
      e.preventDefault();
      const [key, ds] = b.dataset.datepick.split("|");
      datePickerValues[key] = ds;
      datePickerOpenFor = null;
      rerenderFn();
    });
    document.querySelectorAll("[data-dateminicalmove]").forEach(b=>b.onclick=(e)=>{
      e.preventDefault();
      const [key, dir] = b.dataset.dateminicalmove.split("|");
      const anchor = datePickerMonth[key];
      let m = anchor.m + parseInt(dir,10), y = anchor.y;
      if(m<0){m=11;y--;} if(m>11){m=0;y++;}
      datePickerMonth[key] = {y,m};
      rerenderFn();
    });
  }


  function dealById(id){ return DB.deals.find(d=>d.id===id); }
  function normalizeMerchantKey(name){
    return (name||"").toLowerCase().replace(/\b(llc|inc|corp|pllc|ps|pc|dba)\b/g,"").replace(/[^a-z0-9]/g,"").trim();
  }

  function logEvent(text, dealId){
    DB.eventLog = DB.eventLog || [];
    const now = new Date();
    const stamp = now.toLocaleDateString("en-US",{month:"short",day:"numeric"}) + " " + now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
    const entry = {date: todayStr(), stamp, text};
    if(dealId) entry.dealId = dealId;
    DB.eventLog.push(entry);
  }

  // Deals owned by someone else, just sitting on our platform — Yaakov doesn't work
  // these at all. Excluded from every "active work" surface, kept only on their own page.
  function isOtherOwnerDeal(d){ return !!(d.owner && d.owner.isOurs===false); }
  function ourDeals(){ return DB.deals.filter(d=>!isOtherOwnerDeal(d)); }

  function dealsMissingContact(){
    return ourDeals().filter(d=>{
      const st = statusOf(d.status);
      if(st.terminal) return false;
      const c = d.contact || {};
      return !(c.name && (c.phone || c.email));
    });
  }

  function openCommitments(){
    return DB.commitments.filter(c=>{
      if(c.status!=="open") return false;
      const d = dealById(c.dealId);
      return d && !isOtherOwnerDeal(d);
    }).sort((a,b)=>(a.dueDate||"").localeCompare(b.dueDate||""));
  }
  // ---------------- REMINDERS ----------------
  // A reminder is not a commitment. A commitment is a promise somebody made; a reminder
  // is just "poke me about this at 4pm." It has a clock time, it fires, and it sits on the
  // Notifications page until it's marked done or pushed to a new time.
  function allReminders(){
    return (DB.reminders||[]).filter(r=>{
      if(!r.dealId) return true;
      const d = dealById(r.dealId);
      return !d || !isOtherOwnerDeal(d);
    });
  }
  function firedReminders(){
    return allReminders().filter(r=>r.status==="open" && dueAtPassed(r.dueAt))
      .sort((a,b)=> a.dueAt < b.dueAt ? -1 : 1);
  }
  function upcomingReminders(){
    return allReminders().filter(r=>r.status==="open" && !dueAtPassed(r.dueAt))
      .sort((a,b)=> a.dueAt < b.dueAt ? -1 : 1);
  }
  function reminderById(id){ return (DB.reminders||[]).find(r=>r.id===id); }

  // ---------------- INBOX ----------------
  // What has ARRIVED and not yet been read. Our own updates never appear here — a note we
  // wrote is not news. Reading an item removes it, the same way a notification clears once
  // you have opened the message.
  // Conditional items. Ours-only, and due when their check date arrives.
  function openWatch(){
    return (DB.watch||[]).filter(w=>{
      if(w.status!=="open") return false;
      if(w.dealId){ const d = dealById(w.dealId); if(d && isOtherOwnerDeal(d)) return false; }
      return true;
    }).sort((a,b)=> (a.checkOn||"") < (b.checkOn||"") ? -1 : 1);
  }
  function dueWatch(){ const t = todayStr(); return openWatch().filter(w=>(w.checkOn||"") <= t); }
  function watchById(id){ return (DB.watch||[]).find(w=>w.id===id); }

  // Emergency contacts come off the application \u2014 a spouse, a partner, an accountant.
  // When a merchant stops answering their own phone this is the next route. David asked for
  // it after Grand Central went silent on both call and text.
  let drawerEditingEmergency = null;
  function emergencyContactsHtml(d){
    const list = d.emergencyContacts || [];
    let h = '<div class="cd-drsect">Emergency Contacts'
      + (list.length ? ' <span style="color:var(--label-3);">\u00B7 '+list.length+'</span>' : '')
      + '</div>';
    if(list.length){
      h += list.map((ec,i)=>'<div class="cd-comment">'
        + '<div class="cd-comment-head"><b>'+esc(ec.name||"\u2014")+(ec.relationship?' <span style="color:var(--label-2);font-weight:400;">\u00B7 '+esc(ec.relationship)+'</span>':'')+'</b>'
        + '<button class="cd-comment-del" data-delemerg="'+d.id+'|'+i+'">Remove</button></div>'
        + '<div class="cd-comment-text">'+esc(ec.phone||"\u2014")+(ec.email?' \u00B7 '+esc(ec.email):'')+'</div>'
        + (ec.note?'<div class="cd-remmeta">'+esc(ec.note)+'</div>':'')
        + (ec.lastTried?'<div class="cd-remmeta">Last tried '+esc(fmtDateShort(ec.lastTried))+'</div>':'')
        + '<div class="cd-remacts"><button data-triedemerg="'+d.id+'|'+i+'">Mark tried today</button></div>'
        + '</div>').join("");
    } else {
      h += '<div class="cd-caption" style="margin:0 0 8px;">None on file. These come off the application and are the next route when the merchant stops answering.</div>';
    }
    if(drawerEditingEmergency === d.id){
      h += '<div class="cd-comment">'
        + '<input class="cd-note" id="cdEmergName" placeholder="Name" style="min-height:auto;padding:8px 10px;margin-bottom:6px;">'
        + '<input class="cd-note" id="cdEmergRel" placeholder="Relationship (partner, spouse, accountant)" style="min-height:auto;padding:8px 10px;margin-bottom:6px;">'
        + '<input class="cd-note" id="cdEmergPhone" placeholder="Phone" style="min-height:auto;padding:8px 10px;margin-bottom:6px;">'
        + '<input class="cd-note" id="cdEmergEmail" placeholder="Email (optional)" style="min-height:auto;padding:8px 10px;margin-bottom:6px;">'
        + '<input class="cd-note" id="cdEmergNote" placeholder="Note (optional)" style="min-height:auto;padding:8px 10px;margin-bottom:8px;">'
        + '<div id="cdEmergErr" class="cd-remmeta" style="color:var(--sys-red);"></div>'
        + '<button class="cd-savebtn" data-saveemerg="'+d.id+'">Save</button> '
        + '<button class="cd-inlinebtn" id="cdCancelEmerg">Cancel</button>'
        + '</div>';
    } else {
      h += '<button class="cd-inlinebtn" data-addemerg="'+d.id+'">Add emergency contact</button>';

    return h;
  }

  // ---------------------------------------------------------------------------
  // Global search.
  //
  // Searches every record type, not just deal names — notes, contacts, reminder text,
  // task descriptions, watch conditions, commitments, inbox items, broker names. The
  // point is that if it was typed into the app it can be found again, because the
  // thing you remember about a deal is rarely its name.
  //
  // Scoring is deliberately blunt: exact identifier match first, then name, then body
  // text. Sorting by relevance a hundred results is worse than showing the obvious one
  // at the top and letting the eye do the rest.
  // ---------------------------------------------------------------------------
  let searchSel = 0, searchHits = [];

  function searchIdent(d){
    return [d.mcht, d.leadId ? ("Lead " + d.leadId) : null].filter(Boolean).join(" \u00B7 ");
  }

  function collectSearchable(){
    const out = [];
    const dealName = id => { const d = dealById(id); return d ? d.name : ""; };

    (DB.deals || []).forEach(d => {
      const notes = (d.notesLog || []).map(n => n.text).join(" \u00B7 ");
      const pend  = (d.pending || []).filter(p => !p.done).map(p => p.text).join(" \u00B7 ");
      const ec    = (d.emergencyContacts || []).map(c =>
                      [c.name, c.relationship, c.phone, c.email, c.note].filter(Boolean).join(" ")).join(" \u00B7 ");
      const c     = d.contact || {};
      out.push({
        kind: "Deal", id: d.id, dealId: d.id,
        title: d.name,
        meta: [searchIdent(d), statusOf(d.status).label, d.platform, d.source].filter(Boolean).join("  \u00B7  "),
        ident: searchIdent(d) + " " + (d.mcht || "") + " " + (d.leadId || ""),
        body: [notes, pend, ec, c.name, c.phone, c.email, d.notes, d.dba,
               (d.legalCase || {}).firm, (d.legalCase || {}).caseStatusLegacy].filter(Boolean).join("  \u00B7  ")
      });
    });

    (DB.reminders || []).filter(r => r.status === "open").forEach(r => out.push({
      kind: "Reminder", id: r.id, dealId: r.dealId,
      title: r.text.split("\n")[0].slice(0, 110),
      meta: [fmtDateShort((r.dueAt || "").slice(0,10)), dealName(r.dealId)].filter(Boolean).join("  \u00B7  "),
      ident: "", body: r.text
    }));

    (DB.tasks || []).filter(x => x.status === "open").forEach(x => out.push({
      kind: "Task", id: x.id, dealId: x.dealId,
      title: x.description.split("\n")[0].slice(0, 110),
      meta: [x.waitingOn ? ("waiting on " + x.waitingOn) : null, dealName(x.dealId)].filter(Boolean).join("  \u00B7  "),
      ident: "", body: x.description
    }));

    (DB.watch || []).filter(w => w.status === "open").forEach(w => out.push({
      kind: "Watch condition", id: w.id, dealId: w.dealId,
      title: w.condition,
      meta: [fmtDateShort(w.checkOn), dealName(w.dealId)].filter(Boolean).join("  \u00B7  "),
      ident: "", body: [w.ifMet, w.ifFailed, w.source].filter(Boolean).join("  \u00B7  ")
    }));

    (DB.commitments || []).filter(c => c.status === "Open").forEach(c => out.push({
      kind: "Commitment", id: c.id, dealId: c.dealId,
      title: c.what,
      meta: [fmtDateShort(c.dueDate), c.who, dealName(c.dealId)].filter(Boolean).join("  \u00B7  "),
      ident: "", body: [c.what, c.who, c.notes].filter(Boolean).join("  \u00B7  ")
    }));

    (DB.inbox || []).forEach(i => out.push({
      kind: "Inbox", id: i.id, dealId: i.dealId,
      title: i.title,
      meta: [i.source, (i.receivedAt || "").slice(5,10)].filter(Boolean).join("  \u00B7  "),
      ident: "", body: [i.title, i.detail].filter(Boolean).join("  \u00B7  ")
    }));

    (DB.brokers || []).forEach(b => out.push({
      kind: "Broker", id: b.id || b.name, dealId: null,
      title: b.name,
      meta: [b.contact, b.phone, b.email].filter(Boolean).join("  \u00B7  "),
      ident: "", body: [b.name, b.contact, b.phone, b.email, b.notes].filter(Boolean).join("  \u00B7  ")
    }));

    return out;
  }

  function runSearch(q){
    q = (q || "").trim().toLowerCase();
    if(q.length < 2) return [];
    // Every term must appear somewhere, so "rice r29" narrows rather than widens.
    const terms = q.split(/\s+/);
    const scored = [];
    collectSearchable().forEach(item => {
      const hay = (item.title + " " + item.meta + " " + item.ident + " " + item.body).toLowerCase();
      if(!terms.every(t => hay.includes(t))) return;
      let score = 0;
      const title = item.title.toLowerCase(), ident = item.ident.toLowerCase();
      if(ident.includes(q)) score += 100;                       // typed an MCHT or lead id
      if(title.includes(q)) score += 60;
      if(title.startsWith(q)) score += 30;
      if(item.kind === "Deal") score += 12;                     // deals over their own notes
      if(item.meta.toLowerCase().includes(q)) score += 8;
      scored.push({ item, score });
    });
    scored.sort((a,b)=> b.score - a.score || a.item.title.localeCompare(b.item.title));
    const top = scored.slice(0, 60);
    // Group by kind so the headers read as sections rather than repeating every few rows,
    // but order the groups by their best hit so the most relevant type stays at the top.
    const order = [], buckets = {};
    top.forEach(s => {
      if(!buckets[s.item.kind]){ buckets[s.item.kind] = []; order.push(s.item.kind); }
      buckets[s.item.kind].push(s.item);
    });
    return order.flatMap(k => buckets[k]);
  }

  function highlight(text, q){
    const safe = esc(text || "");
    const terms = (q || "").trim().split(/\s+/).filter(x => x.length > 1);
    if(!terms.length) return safe;
    // Escape regex metacharacters — merchant names contain & and ( ) often enough.
    const rx = new RegExp("(" + terms.map(x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
    return safe.replace(rx, "<mark>$1</mark>");
  }

  function snippetAround(body, q){
    const terms = (q || "").trim().split(/\s+/).filter(x => x.length > 1);
    if(!body || !terms.length) return "";
    const low = body.toLowerCase();
    let at = -1;
    for(const t of terms){ const i = low.indexOf(t); if(i >= 0 && (at < 0 || i < at)) at = i; }
    if(at < 0) return "";
    const start = Math.max(0, at - 70);
    return (start > 0 ? "\u2026" : "") + body.slice(start, start + 240).replace(/\s+/g, " ").trim() + "\u2026";
  }

  function renderSearchResults(q){
    const box = document.getElementById("cdNavSearchResults");
    const cnt = document.getElementById("cdNavSearchCount");
    if(!box) return;
    const nav = document.getElementById("cdNav");
    if(nav) nav.classList.toggle("searching-widen", q.trim().length >= 2);
    searchHits = runSearch(q);
    if(searchSel >= searchHits.length) searchSel = 0;
    if(cnt) cnt.textContent = q.trim().length < 2 ? "" :
      (searchHits.length ? searchHits.length + (searchHits.length === 60 ? "+" : "") : "0");
    if(q.trim().length < 2){
      box.innerHTML = q.trim().length
        ? '<div class="cd-searchempty">Keep typing \u2014 two characters minimum.</div>' : "";
      return;
    }
    if(!searchHits.length){
      box.innerHTML = '<div class="cd-searchempty">Nothing found for &ldquo;' + esc(q) + '&rdquo;.</div>';
      return;
    }
    let html = "", lastKind = null;
    searchHits.forEach((it, i) => {
      if(it.kind !== lastKind){ html += '<div class="cd-sgroup">' + esc(it.kind) + '</div>'; lastKind = it.kind; }
      const snip = snippetAround(it.body, q);
      html += '<button class="cd-sres' + (i === searchSel ? " sel" : "") + '" data-sidx="' + i + '">'
        + '<b>' + highlight(it.title, q) + '</b>'
        + (it.meta ? '<div class="meta">' + highlight(it.meta, q) + '</div>' : '')
        + (snip ? '<div class="snip">' + highlight(snip, q) + '</div>' : '')
        + '</button>';
    });
    box.innerHTML = html;
    box.querySelectorAll("[data-sidx]").forEach(b =>
      b.onclick = () => openSearchHit(searchHits[Number(b.dataset.sidx)]));
  }

  function openSearchHit(it){
    if(!it) return;
    closeSearch();
    const hitDeal = it.dealId && dealById(it.dealId);
    if(hitDeal){ openDrawer(hitDeal); return; }
    // No deal attached — send the user to the page that owns this record type.
    const page = { "Reminder":"notifications", "Task":"tasks", "Watch condition":"watchlist",
                   "Commitment":"calendar", "Inbox":"today", "Broker":"brokers" }[it.kind];
    if(page){ currentPage = page; render(); }
  }

  function openSearch(){
    searchSel = 0;
    const inp = document.getElementById("cdNavSearchInput");
    if(!inp) return;
    renderSearchResults(inp.value);
    inp.focus(); inp.select();
  }
  function closeSearch(){
    searchQuery = "";
    searchHits = [];
    const nav = document.getElementById("cdNav");
    if(nav) nav.classList.remove("searching-widen");
    const box = document.getElementById("cdNavSearchResults");
    if(box) box.innerHTML = "";
    const inp = document.getElementById("cdNavSearchInput");
    if(inp) inp.value = "";
    const cnt = document.getElementById("cdNavSearchCount");
    if(cnt) cnt.textContent = "";
  }

  function inboxUnread(){
    return (DB.inbox||[]).filter(x=>x.status!=="read")
      .sort((a,b)=> a.receivedAt < b.receivedAt ? 1 : -1);
  }
  function inboxById(id){ return (DB.inbox||[]).find(x=>x.id===id); }
  function fmtReceived(ts){
    const {date,time} = splitDueAt(ts);
    if(date === todayStr()) return time ? fmtTime(time) : "today";
    return fmtDateShort(date) + (time ? " " + fmtTime(time) : "");
  }
  const REPEAT_DAYS = {weekly:7, biweekly:14, monthly:30};
  function nextReminderOccurrence(r){
    const step = REPEAT_DAYS[r.repeat];
    if(!step) return null;
    const {date, time} = splitDueAt(r.dueAt);
    // Roll forward from the scheduled date, skipping occurrences already missed, so completing
    // a long-overdue check-in schedules the NEXT real one rather than another overdue one.
    let d = new Date(date+"T12:00:00Z");
    do { d = new Date(d.getTime() + step*86400000); } while(localDateStr(d) <= todayStr());
    return {id: uid("rem"), dealId: r.dealId, text: r.text,
      dueAt: localDateStr(d)+"T"+(time||"09:00"), status:"open", repeat: r.repeat,
      createdDate: todayStr(), history:[{date: nowStamp(), note:"Auto-scheduled after completing the "+fmtDateShort(date)+" check-in"}]};
  }

  function overdueCommitments(){
    const t = todayStr();
    return openCommitments().filter(c=>c.dueDate && c.dueDate < t);
  }
  function dueTodayCommitments(){
    const t = todayStr();
    return openCommitments().filter(c=>c.dueDate === t);
  }

  function openTasks(){
    return DB.tasks.filter(t=>{
      if(t.status!=="open") return false;
      const d = dealById(t.dealId);
      return d && !isOtherOwnerDeal(d);
    });
  }

  function dealsWithLegalCase(){ return ourDeals().filter(d=>d.legalCase); }
  function legalNextFollowUp(deal){
    const lc = deal.legalCase;
    if(!lc) return null;
    const base = lc.lastContactDate || lc.filedDate;
    if(!base) return null;
    const d = new Date(base+"T12:00:00Z");
    d.setDate(d.getDate() + 14 + (lc.snoozeWeeks||0)*7);
    return d.toISOString().slice(0,10);
  }
  function legalIsStale(deal){
    const nf = legalNextFollowUp(deal);
    if(!nf) return false;
    return nf <= todayStr();
  }

  function overnightActivity(){
    const y = new Date(TODAY); y.setDate(y.getDate()-1);
    const yStr = y.toISOString().slice(0,10);
    const t = todayStr();
    return ourDeals().filter(d=>(d.notesLog||[]).some(n=>n.date===t || n.date===yStr));
  }

  function totals(){
    let placed=0, recovered=0, remaining=0;
    ourDeals().forEach(d=>{ placed+=d.original||0; recovered+=d.recovered||0; remaining+=Math.max(0,(d.original||0)-(d.recovered||0)); });
    return {placed, recovered, remaining, rate: placed>0 ? (recovered/placed*100):0};
  }
  function statusCounts(){
    const c = {};
    ourDeals().forEach(d=>{ c[d.status] = (c[d.status]||0)+1; });
    return c;
  }

  // ---------------- NAV & RENDER ----------------
  let currentPage = "today";

  const SEARCH_ICON = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';

  function navSearchHtml(){
    return '<div class="cd-navsearch">'
      + '<div class="cd-navsearchbar' + (searchQuery ? " focused" : "") + '" id="cdNavSearchBar">' + SEARCH_ICON
      + '<input id="cdNavSearchInput" placeholder="Search deals, notes, tasks\u2026" autocomplete="off" spellcheck="false" value="' + esc(searchQuery) + '">'
      + '<span class="cd-navsearchcount" id="cdNavSearchCount"></span>'
      + (searchQuery ? '<button class="cd-navsearchclear" id="cdNavSearchClear" title="Clear">\u00D7</button>' : '')
      + '</div>'
      + '<div id="cdNavSearchResults"></div></div>';
  }

  function navHtml(){
    const missingContact = dealsMissingContact().length;
    const overdue = overdueCommitments().length + DB.deals.filter(d=>legalIsStale(d)).length;
    const openTaskCount = openTasks().length;
    const ICONS = {
      today:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
      calendar:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
      notifications:'<svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2H4.5L6 17z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>',
      tasks:'<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>',
      legal:'<svg viewBox="0 0 24 24"><path d="M12 3v18M5 21h14M12 6l6 2M12 6L6 8M6 8l-3 6h6l-3-6zM18 8l-3 6h6l-3-6z"/></svg>',
      deals:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18M8 15h4"/></svg>',
      merchants:'<svg viewBox="0 0 24 24"><path d="M4 21V9l8-5 8 5v12"/><path d="M4 21h16M9 21v-6h6v6M9 12h.01M15 12h.01"/></svg>',
      repeatbouncers:'<svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>',
      otherdeals:'<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>',

      reports:'<svg viewBox="0 0 24 24"><path d="M4 20h16M6 16V10M11 16V6M16 16v-3"/></svg>',
      watchlist:'<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>'
    };
    function item(id,label,count,urgent){
      return '<button class="cd-navbtn '+(currentPage===id?'on':'')+'" data-page="'+id+'"><span class="cd-navicon">'+(ICONS[id]||'')+'</span>'+label+(count!=null?'<span class="cd-navcount'+(urgent?' urgent':'')+'">'+count+'</span>':'')+'</button>';
    }
    return '<div id="cdNav">'
      + '<div class="cd-brand"><b>Collections HQ</b><span>Breeze / Emberstone</span></div>'
      + navSearchHtml()
      + '<div class="cd-navsec">Daily</div>'
      + item("today","Today", (inboxUnread().length + overdue) || null, inboxUnread().length>0 || overdue>0)
      + item("calendar","Calendar")
      + item("notifications","Notifications", firedReminders().length || null, firedReminders().length>0)
      + '<div class="cd-navsec">Work</div>'
      + item("watchlist","Watchlist", dueWatch().length || null, dueWatch().length>0)
      + item("tasks","Tasks", openTaskCount)
      + item("legal","Legal", DB.deals.filter(d=>d.legalCase && legalIsStale(d)).length, DB.deals.filter(d=>d.legalCase && legalIsStale(d)).length>0)
      + '<div class="cd-navsec">Portfolio</div>'
      + item("deals","Deals", DB.deals.length)
      + item("merchants","Merchants")
      + item("repeatbouncers","Repeat Bouncers", DB.deals.filter(isRepeatBouncer).length)
      + item("otherdeals","Other Deals", DB.deals.filter(isOtherOwnerDeal).length)
      + item("brokers","Brokers")
      + item("reports","Reports")
      + '</div>';
  }

  function pageHtml(){
    if(currentPage==="today") return todayHtml();
    if(currentPage==="calendar") return calendarHtml();
    if(currentPage==="notifications") return notificationsHtml();
    if(currentPage==="watchlist") return watchlistHtml();
    if(currentPage==="tasks") return tasksHtml();
    if(currentPage==="legal") return legalHtml();
    if(currentPage==="deals") return dealsHtml();
    if(currentPage==="merchants") return merchantsHtml();
    if(currentPage==="repeatbouncers") return repeatBouncersHtml();
    if(currentPage==="otherdeals") return otherDealsHtml();
    if(currentPage==="brokers") return brokersHtml();
    if(currentPage==="reports") return reportsHtml();
    return "";
  }

  // Keeps the app on real time: refreshes TODAY, and re-renders when a reminder actually
  // comes due so it appears without anyone reloading the page. Skips the re-render while a
  // drawer is open or a field has focus, so it can never eat what's being typed.
  let lastFiredCount = -1;
  function startClock(){
    setInterval(()=>{
      TODAY = new Date();
      if(!DB) return;
      const n = firedReminders().length;
      const badge = document.querySelector('[data-page="notifications"] .cd-navcount');
      if(badge && String(n)!==badge.textContent) badge.textContent = n;
      if(n !== lastFiredCount){
        lastFiredCount = n;
        const typing = document.activeElement && ["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName);
        const drawerOpen = document.getElementById("cdDrawer") && document.getElementById("cdDrawer").classList.contains("open");
        if(!typing && !drawerOpen && (currentPage==="today" || currentPage==="notifications" || currentPage==="calendar")) render();
      }
    }, 20000);
  }

  function render(){
    const app = document.getElementById("cdApp");
    app.innerHTML = navHtml() + '<div id="cdMain">' + pageHtml() + '</div>';
    wire();
  }

  function wire(){
    bindNavSearch();
    document.querySelectorAll(".cd-nagbanner[data-viewmode-hint]").forEach(el=>el.onclick=()=>{
      currentPage="deals"; dealViewMode=el.dataset.viewmodeHint; render();
    });
    document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{ currentPage=b.dataset.page; render(); });
    document.querySelectorAll("[data-open]").forEach(el=>el.onclick=(e)=>{
      if(e.target.closest(".cd-nagbanner[data-viewmode-hint]")) return;
      const id = el.dataset.open; const d = dealById(id);
      if(d) openDrawer(d);
    });
    document.getElementById("cdDrawerOverlay").onclick = closeDrawer;
    document.getElementById("cdModalOverlay").onclick = (e)=>{ if(e.target.id==="cdModalOverlay") closeQuickTaskModal(); };
    wirePageSpecific();
  }

  function wirePageSpecific(){
    const dealSearchEl = document.getElementById("cdDealSearch");
    if(dealSearchEl){
      dealSearchEl.oninput = ()=>{ dealSearch = dealSearchEl.value; render(); const el=document.getElementById("cdDealSearch"); if(el){ el.focus(); el.selectionStart=el.value.length; } };
    }
    document.querySelectorAll("[data-dealfilter]").forEach(b=>b.onclick=()=>{ dealFilter=b.dataset.dealfilter; render(); });
    document.querySelectorAll("[data-dealviewmode]").forEach(b=>b.onclick=()=>{ dealViewMode=b.dataset.dealviewmode; dealFilter="all"; render(); });

    // Brokers page
    const brokerAddBtn = document.getElementById("cdPageBrokerAddBtn");
    if(brokerAddBtn) brokerAddBtn.onclick = ()=>{ addingBrokerOnPage = true; render(); };
    const brokerAddCancelBtn = document.getElementById("cdPageBrokerAddCancel");
    if(brokerAddCancelBtn) brokerAddCancelBtn.onclick = ()=>{ addingBrokerOnPage = false; render(); };
    const brokerAddSaveBtn = document.getElementById("cdPageBrokerAddSave");
    if(brokerAddSaveBtn) brokerAddSaveBtn.onclick = async ()=>{
      const name = document.getElementById("cdPageNewBrokerName").value.trim();
      if(!name){ document.getElementById("cdPageNewBrokerName").style.borderColor = "var(--red)"; return; }
      const phone = document.getElementById("cdPageNewBrokerPhone").value.trim();
      const email = document.getElementById("cdPageNewBrokerEmail").value.trim();
      DB.brokers = DB.brokers || [];
      DB.brokers.push({id: uid("broker"), name, phone, email});

  let calAnchor = todayStr(); // single date anchor drives all 3 views

  function allCalendarEvents(){
    // returns map dateStr -> [{label, color, dealId}]
    const map = {};
    function add(dateStr, label, color, dealId, time, reminderId){
      if(!dateStr) return;
      if(!map[dateStr]) map[dateStr] = [];
      map[dateStr].push({label, color, dealId, time: time||null, reminderId: reminderId||null});
    }
    DB.commitments.filter(c=>c.status==="open").forEach(c=>{
      const d = dealById(c.dealId);
      if(!d || isOtherOwnerDeal(d)) return;
      add(c.dueDate, d.name+": "+c.description, "var(--blue)", c.dealId);
    });
    ourDeals().filter(d=>d.legalCase).forEach(d=>{
      const nf = legalNextFollowUp(d);
      if(nf) add(nf, d.name+": Legal follow-up", "var(--maroon)", d.id);
    });
    DB.tasks.filter(t=>t.status==="open" && t.dueDate).forEach(t=>{
      const d = dealById(t.dealId);
      if(!d || isOtherOwnerDeal(d)) return;
      add(t.dueDate, d.name+": "+(TASK_TYPES[t.type]||t.type), "var(--purple)", t.dealId);
    });
    allReminders().filter(r=>r.status==="open").forEach(r=>{
      const {date,time} = splitDueAt(r.dueAt);
      const d = r.dealId ? dealById(r.dealId) : null;
      const who = d ? d.name+": " : "";
      add(date, (time?fmtTime(time)+" ":"")+""+who+r.text, "var(--yellow)", r.dealId, time, r.id);
    });
    // Manual-pay deals (wire/manual, invisible to bounce feeds) — recurring check-in
    // computed from the stored frequency, always showing the current upcoming occurrence.
    ourDeals().filter(d=>d.manualPay).forEach(d=>{
      const nd = nextManualPayDate(d.manualPay);
      if(nd) add(nd, d.name+": Check for "+(d.manualPay.method||"manual")+" payment ("+money(d.manualPay.expectedAmount)+")", "var(--green)", d.id);
    });
    return map;
  }

  function nextManualPayDate(mp){
    if(!mp) return null;
    // Trust the stored nextExpectedDate if it's still in the future or today;
    // otherwise project forward from it at the deal's frequency until it lands
    // on or after today, so a missed update doesn't leave a stale/past date sitting there.
    let nd = mp.nextExpectedDate || mp.lastReceivedDate;
    if(!nd) return null;
    const stepDays = mp.frequency==="biweekly" ? 14 : mp.frequency==="weekly" ? 7 : mp.frequency==="monthly" ? 30 : 14;
    let guard = 0;
    while(nd < todayStr() && guard < 36){ nd = addDays(nd, stepDays); guard++; }
    return nd;
  }

  function addDays(dateStr, n){
    const d = new Date(dateStr+"T12:00:00Z");
    d.setDate(d.getDate()+n);
    return d.toISOString().slice(0,10);
  }
  function startOfWeek(dateStr){
    const d = new Date(dateStr+"T12:00:00Z");
    const dow = d.getUTCDay();
    return addDays(dateStr, -dow);
  }

          + (selectedEvs.length ? selectedEvs.map(e=>'<div class="cd-listrow" data-open="'+e.dealId+'"><div><b>'+esc(e.label)+'</b></div></div>').join("") : '<div class="cd-empty">Nothing due this day.</div>')
          + '</div>' : "");
  }

  function monthViewHtml(events){
    const anchor = new Date(calAnchor+"T12:00:00Z");
    const y = anchor.getUTCFullYear(), m = anchor.getUTCMonth();
    const first = new Date(Date.UTC(y, m, 1));
    const startDow = first.getUTCDay();
    const daysInMonth = new Date(Date.UTC(y, m+1, 0)).getUTCDate();
    const label = first.toLocaleDateString("en-US",{month:"long",year:"numeric",timeZone:"UTC"});

    let cells = "";
    for(let i=0;i<startDow;i++) cells += '<div class="cd-calday empty"></div>';
    for(let day=1; day<=daysInMonth; day++){
      const dateStr = y+"-"+String(m+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
      const isToday = dateStr===todayStr();
      const evs = events[dateStr]||[];
      cells += '<div class="cd-calday'+(isToday?' today':'')+'" data-calday="'+dateStr+'">'
        + '<div class="cd-caldate">'+day+'</div>'
        + evs.slice(0,3).map(e=>'<span class="cd-calitem" data-open="'+e.dealId+'" style="background:rgba(255,255,255,.08);color:'+e.color+';" title="'+esc(e.label)+'">'+esc(e.label)+'</span>').join("")
        + (evs.length>3?'<span style="font-size:9px;color:var(--ink-faint);">+'+(evs.length-3)+' more</span>':"")
        + '</div>';
    }
    const body = '<div class="cd-calgrid">'
      + ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>'<div class="cd-calhead">'+d+'</div>').join("")
      + cells + '</div>';
    return {body, label};
  }

  function hourGridHtml(dayDateStrs, events){
    const hourLabels = [];
    for(let h=0;h<24;h++){
      const hr = h===0?"12 AM":h<12?h+" AM":h===12?"12 PM":(h-12)+" PM";
      hourLabels.push('<div class="cd-hourlabel">'+hr+'</div>');
    }
    const now = TODAY;
    const nowTop = (now.getHours() + now.getMinutes()/60) * 44;

    const cols = dayDateStrs.map(ds=>{
      const slots = Array.from({length:24}).map(()=>'<div class="cd-hourslot"></div>').join("");
      const isToday = ds===localDateStr(now);
      const timed = ((events[ds]||[]).filter(e=>e.time)).map(e=>{
        const [h,m] = e.time.split(":").map(Number);
        const top = (h + m/60) * 44;
        return '<div class="cd-timedev" style="top:'+top+'px;" '+(e.dealId?'data-open="'+e.dealId+'"':'')+' title="'+esc(e.label)+'">'+esc(e.label)+'</div>';
      }).join("");
      return '<div class="cd-hourcol" data-calday="'+ds+'">'+slots+timed+(isToday?'<div class="cd-nowline" style="top:'+nowTop+'px;"><div class="cd-nowdot"></div></div>':"")+'</div>';
    }).join("");

    return '<div class="cd-hourgrid">'
      + '<div class="cd-hourlabels">'+hourLabels.join("")+'</div>'
      + '<div class="cd-hourcols" style="grid-template-columns:repeat('+dayDateStrs.length+',1fr);">'+cols+'</div>'
      + '</div>';
  }

  function weekViewHtml(events){
    const weekStart = startOfWeek(calAnchor);
    const days = Array.from({length:7}).map((_,i)=>addDays(weekStart, i));
    const label = new Date(days[0]+"T12:00:00Z").toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"})
      + " – " + new Date(days[6]+"T12:00:00Z").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"});

    const headCells = days.map(ds=>{
      const d = new Date(ds+"T12:00:00Z");
      const isToday = ds===todayStr();
      return '<div class="cd-weekheadcell'+(isToday?' today':'')+'"><div class="dow">'+d.toLocaleDateString("en-US",{weekday:"short",timeZone:"UTC"}).toUpperCase()+'</div><div class="dnum">'+d.getUTCDate()+'</div></div>';
    }).join("");

    const alldayCells = days.map(ds=>{
      const evs = (events[ds]||[]).filter(e=>!e.time);
      return '<div class="cd-allday-cell" data-calday="'+ds+'">'+evs.map(e=>'<span class="cd-calitem-chip" data-open="'+e.dealId+'" title="'+esc(e.label)+'">'+esc(e.label)+'</span>').join("")+'</div>';
    }).join("");

    const body = '<div class="cd-weekwrap">'
      + '<div class="cd-weekheadrow" style="grid-template-columns:52px repeat(7,1fr);"><div></div>'+headCells+'</div>'
      + '<div class="cd-allday-row" style="grid-template-columns:52px repeat(7,1fr);"><div style="font-size:9px;color:var(--ink-faint);padding:4px;">All-day</div>'+alldayCells+'</div>'
      + hourGridHtml(days, events)
      + '</div>';
    return {body, label};
  }

  function dayViewHtml(events){
    const ds = calAnchor;
    const d = new Date(ds+"T12:00:00Z");

        + '<div class="cd-formrow"><label>Date</label>'+dateFieldHtml("newRem")+'</div>'
        + '<div class="cd-formrow"><label>Time</label>'+timeFieldHtml("newRem","16:00")+'</div>'

  function tasksHtml(){
    let list = openTasks();
    if(taskTypeFilter!=="all") list = list.filter(t=>t.type===taskTypeFilter);
    if(taskWaitingFilter!=="all") list = list.filter(t=>t.waitingOn===taskWaitingFilter);
    list.sort((a,b)=>(a.dueDate||"9999").localeCompare(b.dueDate||"9999"));

    const typeChips = ["all",...Object.keys(TASK_TYPES)].map(k=>{
      const label = k==="all"?"All Types":TASK_TYPES[k];
      const cnt = k==="all"?openTasks().length:openTasks().filter(t=>t.type===k).length;
      return '<div class="cd-chip '+(taskTypeFilter===k?'on':'')+'" data-taskfilter="'+k+'">'+label+' <b>'+cnt+'</b></div>';
    }).join("");
    const waitChips = ["all",...Object.keys(WAITING_ON)].map(k=>{
      const label = k==="all"?"Anyone":WAITING_ON[k];
      const cnt = k==="all"?openTasks().length:openTasks().filter(t=>t.waitingOn===k).length;
      return '<div class="cd-chip '+(taskWaitingFilter===k?'on':'')+'" data-waitfilter="'+k+'">'+label+' <b>'+cnt+'</b></div>';
    }).join("");

    let rows = list.map(t=>{
      const d = dealById(t.dealId);
      if(!d) return "";
      const idBits = [d.mcht, d.leadId?("Lead "+d.leadId):null].filter(Boolean).join(" · ");
      const overdue = t.dueDate && t.dueDate < todayStr();
      return '<tr data-open="'+d.id+'">'
        + '<td><span class="cd-badge" style="color:var(--purple);background:var(--purple-bg);">'+esc(TASK_TYPES[t.type]||t.type)+'</span></td>'
        + '<td class="cd-namecell"><b>'+esc(d.name)+'</b><span>'+esc(idBits)+'</span></td>'
        + '<td>'+esc(t.description||"—")+'</td>'
        + '<td><span class="cd-badge" style="color:var(--blue);background:var(--blue-bg);">'+esc(WAITING_ON[t.waitingOn]||t.waitingOn)+'</span></td>'
        + '<td class="mono" style="'+(overdue?'color:var(--red);':'')+'">'+(t.dueDate?fmtDateShort(t.dueDate):"—")+'</td>'
        + '<td><input type="checkbox" data-taskdone="'+t.id+'" onclick="event.stopPropagation()"></td>'
        + '</tr>';
    }).join("");

    return '<div class="cd-h1">Tasks</div><p class="cd-sub">Every open task across all deals — six recurring types, each with who it\'s waiting on.</p>'
      + '<div class="cd-toolbar"><button class="cd-savebtn" id="cdNewTask">+ New Task</button></div>'
      + '<div class="cd-chiprow">'+typeChips+'</div>'
      + '<div class="cd-chiprow">'+waitChips+'</div>'
      + '<div class="cd-panel" style="padding:0;overflow-x:auto;"><table class="cd-table"><thead><tr>'
      + '<th>Type</th><th>Deal</th><th>Description</th><th>Waiting On</th><th>Due</th><th>Done</th>'
      + '</tr></thead><tbody>'+(rows||'<tr><td colspan="6" class="cd-empty">No open tasks match.</td></tr>')+'</tbody></table></div>';
  }

  // ---------------- LEGAL ----------------
  function legalHtml(){
    let rows = dealsWithLegalCase();
    rows.sort((a,b)=>{
      const sa = legalIsStale(a) ? 0 : 1;
      const sb = legalIsStale(b) ? 0 : 1;
      return sa - sb;
    });

    let body = rows.map(d=>{
      const lc = d.legalCase;
      const stage = LEGAL_STAGES[lc.stage] || {label:lc.stage};
      const stale = legalIsStale(d);
      const nf = legalNextFollowUp(d);
      const remaining = Math.max(0,(d.original||0)-(d.recovered||0));
      const docsSent = Object.values(lc.docs||{}).filter(v=>v==="sent").length;
      const docsTotal = Object.keys(LEGAL_DOC_LABELS).length;
      const docsMissing = Object.keys(LEGAL_DOC_LABELS).filter(k=>(lc.docs||{})[k]==="pending");
      return '<tr data-open="'+d.id+'">'
        + '<td class="cd-namecell"><b>'+esc(d.name)+'</b><span>'+esc(d.mcht||"")+(d.leadId?' · Lead '+esc(d.leadId):"")+'</span></td>'
        + '<td>'+esc(lc.firm||"—")+(lc.needsReview?' <span class="cd-flagpill">Review</span>':"")+'</td>'
        + '<td><span class="cd-badge" style="background:rgba(255,255,255,.08);">'+esc(stage.label)+'</span></td>'
        + '<td style="'+(stale?'color:var(--red);':'')+'">'+(nf?fmtDateShort(nf)+(stale?' (due)':""):"—")+'</td>'
        + '<td>'+docsSent+'/'+docsTotal+(docsMissing.length?' <span style="color:var(--yellow);">missing '+docsMissing.length+'</span>':'')+'</td>'
        + '<td class="mono" style="color:var(--maroon);">'+money(remaining)+'</td>'
        + '</tr>';
    }).join("");

    return '<div class="cd-h1">Legal</div><p class="cd-sub">Every filed deal — stage, document checklist completion, and follow-up cadence (2 weeks of silence auto-flags, snoozable).</p>'
      + '<div class="cd-panel" style="padding:0;overflow-x:auto;"><table class="cd-table"><thead><tr>'
      + '<th>Deal</th><th>Firm</th><th>Stage</th><th>Next Follow-up</th><th>Docs</th><th>Remaining</th>'
      + '</tr></thead><tbody>'+(body||'<tr><td colspan="6" class="cd-empty">No legal cases tracked right now.</td></tr>')+'</tbody></table></div>';
  }

  // ---------------- DEALS ----------------
  let dealFilter = "all";
  let dealSearch = "";
  let dealSort = {col:"remaining", dir:"desc"};
  let dealViewMode = "standard";

  const DEAL_VIEW_MODES = {
    standard:        {label:"All Deals", predicate: d=>!isOtherOwnerDeal(d)},
    missingcontact:  {label:"Missing Contact", predicate: d=>{ if(isOtherOwnerDeal(d)) return false; const c=d.contact||{}; return !(c.name && (c.phone||c.email)); }},
    paused:          {label:"Paused / Lowered", predicate: d=> !isOtherOwnerDeal(d) && (d.pauseInfo || (d.flags||[]).includes("Paused Schedule"))},
    settlements:     {label:"Settlements", predicate: d=> !isOtherOwnerDeal(d) && (d.settlement || d.status==="debt_relief")},
    manualpay:       {label:"Manual Pay", predicate: d=> !isOtherOwnerDeal(d) && !!d.manualPay},
    clawback:        {label:"Clawback Active", predicate: d=> !isOtherOwnerDeal(d) && d.clawback && d.clawback!=="none"}
  };

  function dealsHtml(){
    const counts = statusCounts();
    const mode = DEAL_VIEW_MODES[dealViewMode] || DEAL_VIEW_MODES.standard;
    let list = DB.deals.filter(d=>{
      if(!mode.predicate(d)) return false;
      if(dealFilter!=="all" && d.status!==dealFilter) return false;
      if(dealSearch){
        const s = dealSearch.toLowerCase();
        return (d.name||"").toLowerCase().includes(s) || (d.mcht||"").toLowerCase().includes(s) || (d.leadId||"").toLowerCase().includes(s);
      }
      return true;
    });
    list.sort((a,b)=>{
      let av,bv;
      if(dealSort.col==="name"){ av=a.name||""; bv=b.name||""; }
      else if(dealSort.col==="remaining"){ av=(a.original||0)-(a.recovered||0); bv=(b.original||0)-(b.recovered||0); }
      else { av=a.name; bv=b.name; }
      if(typeof av==="string") return dealSort.dir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
      return dealSort.dir==="asc"?av-bv:bv-av;
    });

    const viewChips = Object.keys(DEAL_VIEW_MODES).map(k=>{
      const cnt = DB.deals.filter(DEAL_VIEW_MODES[k].predicate).length;
      const urgent = k==="missingcontact" && cnt>0;
      return '<div class="cd-chip '+(dealViewMode===k?'on':'')+'" data-dealviewmode="'+k+'" style="'+(urgent?'color:var(--red);':'')+'">'+DEAL_VIEW_MODES[k].label+' <b>'+cnt+'</b></div>';
    }).join("");
    const statusChips = ["all",...Object.keys(STATUS)].map(k=>{
      const label = k==="all"?"All":statusOf(k).label;
      const cnt = k==="all"?DB.deals.length:(counts[k]||0);
      const color = k==="all"?null:statusOf(k).color;
      return '<div class="cd-chip '+(dealFilter===k?'on':'')+'" data-dealfilter="'+k+'"'+(color?' style="color:'+color+'"':'')+'>'+(color?'<span class="cd-dot" style="background:'+color+'"></span>':'')+label+' <b>'+cnt+'</b></div>';
    }).join("");

    let rows = list.map(d=>{
      const st = statusOf(d.status);
      const p = pct(d.recovered, d.original);
      const remaining = Math.max(0,(d.original||0)-(d.recovered||0));
      const c = d.contact||{};
      const missingContact = !(c.name && (c.phone||c.email));
      return '<tr data-open="'+d.id+'">'
        + '<td class="cd-namecell"><b>'+esc(d.name)+(missingContact?'<span class="cd-flagpill" style="background:var(--red-bg);color:var(--red);">No Contact</span>':"")+(d.flags&&d.flags.length?d.flags.map(f=>'<span class="cd-flagpill">'+esc(f)+'</span>').join(""):"")+'</b><span>'+esc(d.mcht||"")+(d.leadId?' · Lead '+esc(d.leadId):"")+(d.contractUrl?' · <a href="'+esc(d.contractUrl)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--amber);">Contract</a>':"")+'</span></td>'
        + '<td><span class="cd-badge" style="color:'+st.color+';background:'+st.bg+'">'+st.label+'</span></td>'
        + '<td class="mono">'+money(remaining)+'</td>'
        + '<td><span class="cd-pctbar"><i style="width:'+p.toFixed(0)+'%"></i></span><span class="mono">'+p.toFixed(0)+'%</span></td>'
        + '<td>'+esc(d.source||"—")+'</td>'
        + '</tr>';
    }).join("");

    return '<div class="cd-h1">Deals</div><p class="cd-sub">Every deal currently tracked. Click a row for full detail.</p>'
      + '<div class="cd-chiprow">'+viewChips+'</div>'
      + '<div class="cd-chiprow">'+statusChips+'</div>'
      + '<div class="cd-toolbar"><input class="cd-search" id="cdDealSearch" placeholder="Search name, MCHT, lead ID" value="'+esc(dealSearch)+'"></div>'
      + '<div class="cd-panel" style="padding:0;overflow-x:auto;"><table class="cd-table"><thead><tr>'
      + '<th>Deal</th><th>Status</th><th>Remaining</th><th>% Recovered</th><th>Source</th>'
      + '</tr></thead><tbody>'+(rows||'<tr><td colspan="5" class="cd-empty">No deals match.</td></tr>')+'</tbody></table></div>';
  }

  // ---------------- MERCHANTS ----------------
  function merchantsHtml(){
    const groups = {};
    ourDeals().forEach(d=>{
      const key = normalizeMerchantKey(d.name);
      if(!groups[key]) groups[key] = {name:d.name, deals:[]};
      groups[key].deals.push(d);
    });
    const multi = Object.values(groups).filter(g=>g.deals.length>1);
    const single = Object.values(groups).filter(g=>g.deals.length===1);

    function groupRow(g){
      const totalRemaining = g.deals.reduce((s,d)=>s+Math.max(0,(d.original||0)-(d.recovered||0)),0);
      const worstStatus = g.deals.reduce((worst,d)=>statusOf(d.status).severity > statusOf(worst.status).severity ? d : worst, g.deals[0]);
      return '<div class="cd-panel" style="margin-bottom:10px;">'

  // ---------------- REPEAT BOUNCERS ----------------
  // A "cyclical" bouncer — bounced, cleared, bounced again — rather than a deal that's
  // just been failing nonstop since day one. Approximated from lifetime vs. consecutive
  // returns: a wide gap between them means clears happened somewhere in between.
  function isRepeatBouncer(d){
    if(isOtherOwnerDeal(d)) return false;
    const lifetime = d.lifetime||0, consecutive = d.consecutive||0;
    if(statusOf(d.status).terminal) return false;
    return lifetime >= 4 && consecutive < lifetime;
  }
  function repeatBouncersHtml(){
    let list = DB.deals.filter(isRepeatBouncer);
    list.sort((a,b)=> (b.lifetime-b.consecutive) - (a.lifetime-a.consecutive));
    let rows = list.map(d=>{
      const st = statusOf(d.status);
      const clearedCycles = Math.max(0, (d.lifetime||0) - (d.consecutive||0));
      return '<tr data-open="'+d.id+'">'
        + '<td class="cd-namecell"><b>'+esc(d.name)+'</b><span>'+esc(d.mcht||"")+(d.leadId?' · Lead '+esc(d.leadId):"")+'</span></td>'
        + '<td><span class="cd-badge" style="color:'+st.color+';background:'+st.bg+';">'+st.label+'</span></td>'
        + '<td class="mono">'+(d.lifetime||0)+'</td>'
        + '<td class="mono">'+(d.consecutive||0)+'</td>'
        + '<td class="mono" style="color:var(--yellow);">'+clearedCycles+'</td>'
        + '<td class="mono" style="color:var(--maroon);">'+money(Math.max(0,(d.original||0)-(d.recovered||0)))+'</td>'
        + '</tr>';
    }).join("");
    return '<div class="cd-h1">Repeat Bouncers</div><p class="cd-sub">Deals with a cyclical pattern — bounce, clear, bounce again — rather than a single unbroken streak. Sorted by how much "clearing" has happened between bounces (a rough proxy for how many separate cycles).</p>'
      + '<div class="cd-panel" style="padding:0;overflow-x:auto;"><table class="cd-table"><thead><tr>'
      + '<th>Deal</th><th>Status</th><th>Lifetime Returns</th><th>Current Streak</th><th>Implied Clear Cycles</th><th>Remaining</th>'
      + '</tr></thead><tbody>'+(rows||'<tr><td colspan="6" class="cd-empty">No deals match this pattern right now.</td></tr>')+'</tbody></table></div>';
  }

        + (dealCommitments.filter(c=>c.status==="open").length ? dealCommitments.filter(c=>c.status==="open").map(c=>{
            if(commitEditingId===c.id){
              return '<div class="cd-comment">'
                + '<input class="cd-note" id="cdEditCommitDesc-'+c.id+'" value="'+esc(c.description)+'" style="min-height:auto;padding:8px 10px;margin-bottom:6px;">'
                + '<select class="cd-select" id="cdEditCommitBy-'+c.id+'" style="margin-bottom:6px;">'+Object.keys(WAITING_ON).map(k=>'<option value="'+k+'" '+(c.promisedBy===k?"selected":"")+'>'+WAITING_ON[k]+' promised</option>').join("")+'</select>'
                + dateFieldHtml("editCommit-"+c.id)
                + '<button class="cd-savebtn" data-commitsave="'+c.id+'">Save</button> '
                + '<button class="cd-inlinebtn" data-commitcancel="'+c.id+'">Cancel</button>'
                + '</div>';
            }
            const od = daysUntil(c.dueDate);
            const odLabel = od<0?Math.abs(od)+"d overdue":od===0?"Due today":"Due in "+od+"d";
            const recurLabel = c.recurrenceDays===7?"weekly":c.recurrenceDays===14?"every 2 weeks":c.recurrenceDays===30?"monthly":c.recurrenceDays?"every "+c.recurrenceDays+"d":null;
            return '<div class="cd-comment"><div class="cd-comment-head"><span class="cd-comment-time">'+esc(WAITING_ON[c.promisedBy])+' — due '+fmtDateShort(c.dueDate)+' ('+odLabel+')'+(recurLabel?' <span style="color:var(--blue);">↻ '+recurLabel+'</span>':'')+'</span></div>'
              + '<div class="cd-comment-text">'+esc(c.description)+'</div>'
              + '<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">'
              + '<button class="cd-inlinebtn" data-commitedit="'+c.id+'">Edit</button>'
              + '<button class="cd-inlinebtn" data-commitfulfill="'+c.id+'">Mark Fulfilled</button>'
              + '<button class="cd-inlinebtn" data-commitbreak="'+c.id+'" style="color:var(--red);">Broken</button>'
              + '</div></div>';
          }).join("") : '<p class="cd-caption">No open commitments.</p>')
        + sectionHtml("resolved-commit","Resolved ("+dealCommitments.filter(c=>c.status!=="open").length+")",
            dealCommitments.filter(c=>c.status!=="open").length ? dealCommitments.filter(c=>c.status!=="open").map(c=>{
              return '<div class="cd-comment" style="opacity:.6;"><div class="cd-comment-head"><span class="cd-comment-time">'+esc(c.status)+' — was due '+fmtDateShort(c.dueDate)+'</span></div><div class="cd-comment-text">'+esc(c.description)+'</div></div>';
            }).join("") : '<p class="cd-caption">None yet.</p>');
    } else if(drawerTab==="tasks"){
      body = '<div class="cd-drsect">New Task</div>'
        + '<select class="cd-select" id="cdNewTaskType" style="margin-bottom:6px;">'+Object.keys(TASK_TYPES).map(k=>'<option value="'+k+'">'+TASK_TYPES[k]+'</option>').join("")+'</select>'
        + '<select class="cd-select" id="cdNewTaskWaiting" style="margin-bottom:6px;">'+Object.keys(WAITING_ON).map(k=>'<option value="'+k+'">Waiting on '+WAITING_ON[k]+'</option>').join("")+'</select>'
        + '<input class="cd-note" id="cdNewTaskDesc" placeholder="Details (optional)" style="min-height:auto;padding:8px 10px;margin-bottom:6px;">'
        + dateFieldHtml("newTask")
        + '<button class="cd-savebtn" id="cdAddTask">Add Task</button>'
        + '<div class="cd-drsect">Open ('+dealTasks.filter(t=>t.status==="open").length+')</div>'
        + (dealTasks.filter(t=>t.status==="open").length ? dealTasks.filter(t=>t.status==="open").map(t=>{
            if(taskEditingId===t.id){
              return '<div class="cd-comment">'
                + '<select class="cd-select" id="cdEditTaskType-'+t.id+'" style="margin-bottom:6px;">'+Object.keys(TASK_TYPES).map(k=>'<option value="'+k+'" '+(t.type===k?"selected":"")+'>'+TASK_TYPES[k]+'</option>').join("")+'</select>'
                + '<select class="cd-select" id="cdEditTaskWaiting-'+t.id+'" style="margin-bottom:6px;">'+Object.keys(WAITING_ON).map(k=>'<option value="'+k+'" '+(t.waitingOn===k?"selected":"")+'>Waiting on '+WAITING_ON[k]+'</option>').join("")+'</select>'
                + '<input class="cd-note" id="cdEditTaskDesc-'+t.id+'" value="'+esc(t.description||"")+'" style="min-height:auto;padding:8px 10px;margin-bottom:6px;">'
                + dateFieldHtml("editTask-"+t.id)
                + '<div style="margin-top:8px;"><button class="cd-savebtn" data-tasksave="'+t.id+'">Save</button> <button class="cd-inlinebtn" data-taskcancel="'+t.id+'">Cancel</button></div>'
                + '</div>';
            }
            return '<div class="cd-comment"><div class="cd-comment-head" style="align-items:center;">'
              + '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;flex:1;"><input type="checkbox" data-taskcompletebox="'+t.id+'"><span class="cd-comment-time">'+esc(TASK_TYPES[t.type])+' — waiting on '+esc(WAITING_ON[t.waitingOn])+(t.dueDate?' — due '+fmtDateShort(t.dueDate):"")+'</span></label>'
              + '<button class="cd-comment-del" data-taskedit="'+t.id+'">Edit</button></div>'
              + '<div class="cd-comment-text">'+esc(t.description||"—")+'</div></div>';
          }).join("") : '<p class="cd-caption">No open tasks.</p>');
    } else if(drawerTab==="legal"){
      if(!d.legalCase){
        body = '<p class="cd-caption">No legal case on this deal.</p><button class="cd-savebtn" id="cdStartLegal" style="margin-top:8px;">Start Legal Case</button>';
      } else {
        const lc = d.legalCase;
        const nf = legalNextFollowUp(d);
        body = (lc.needsReview ? '<div class="cd-warn">This case was migrated from the old system — stage and documents are a best guess. Please review and correct.</div>' : "")
          + '<div class="cd-drsect">Firm &amp; Stage</div>'
          + '<select class="cd-select" id="cdLegalFirmSelect" style="margin-bottom:6px;">'
            + Object.keys(KNOWN_FIRMS).map(f=>'<option value="'+esc(f)+'" '+((lc.firm===f || (!Object.keys(KNOWN_FIRMS).includes(lc.firm) && f==="Other"))?"selected":"")+'>'+esc(f)+'</option>').join("")
          + '</select>'
          + (!Object.keys(KNOWN_FIRMS).includes(lc.firm)
              ? '<input class="cd-note" id="cdLegalFirmOther" value="'+esc(lc.firm||"")+'" placeholder="Firm name" style="min-height:auto;padding:8px 10px;margin-bottom:6px;">'
              : '')
          + '<select class="cd-select" id="cdLegalStage" style="margin-bottom:10px;">'+Object.keys(LEGAL_STAGES).map(k=>'<option value="'+k+'" '+(lc.stage===k?'selected':'')+'>'+LEGAL_STAGES[k].label+'</option>').join("")+'</select>'
          + '<div class="cd-tlrow"><span>Filed</span><span>'+fmtDate(lc.filedDate)+'</span></div>'
          + '<div class="cd-tlrow"><span>Last Contact</span><span>'+fmtDate(lc.lastContactDate)+'</span></div>'
          + '<div class="cd-tlrow"><span>Next Follow-up</span><span style="'+(legalIsStale(d)?'color:var(--red);':'')+'">'+(nf?fmtDate(nf):"—")+'</span></div>'
          + '<button class="cd-inlinebtn" data-legalcontacttoday="'+d.id+'" style="margin-top:6px;">Log contact today</button> '
          + '<select class="cd-select" id="cdLegalSnooze" style="display:inline-block;width:auto;margin-top:6px;"><option value="0">Snooze...</option><option value="1">+1 week</option><option value="2">+2 weeks</option><option value="3">+3 weeks</option><option value="4">+4 weeks</option></select>'
          + sectionHtml("legaldocs","Document Checklist ("+Object.keys(LEGAL_DOC_LABELS).filter(k=>(lc.docs||{})[k]&&(lc.docs||{})[k]!=="pending").length+"/"+Object.keys(LEGAL_DOC_LABELS).length+")",
              Object.keys(LEGAL_DOC_LABELS).map(k=>{
                const v = (lc.docs||{})[k]||"pending";
                return '<div class="cd-docrow"><span>'+LEGAL_DOC_LABELS[k]+'</span><div class="cd-docstate">'
                  + '<button class="cd-docbtn '+(v==="sent"?"on":"")+'" data-doctoggle="'+d.id+'|'+k+'|sent">Sent</button>'
                  + '<button class="cd-docbtn na '+(v==="na"?"on":"")+'" data-doctoggle="'+d.id+'|'+k+'|na">N/A</button>'
                  + '</div></div>';
              }).join(""))
          + '<div class="cd-drsect">Case Notes</div>'
          + '<div class="cd-comment-text" style="color:var(--ink-dim);">'+esc(lc.caseStatusLegacy||"—")+'</div>';
      }
    } else if(drawerTab==="pending"){
      body = (d.pending||[]).length ? d.pending.map((p,i)=>'<div class="cd-comment"><div class="cd-comment-head"><span class="cd-comment-time">'+esc(p.date||"")+'</span></div><div class="cd-comment-text" style="'+(p.done?"text-decoration:line-through;color:var(--ink-faint);":"")+'">'+esc(p.text)+'</div></div>').join("") : '<p class="cd-caption">Nothing legacy-pending on this deal.</p>';
    }

    return '<button class="cd-drclose" data-drclose="1">×</button>'
      + '<div class="cd-drtitle">'+esc(d.name)+'</div>'
      + '<div class="cd-drsub">'+esc(d.mcht||"")+(d.leadId?' · Lead '+esc(d.leadId):"")+' · <span class="cd-badge" style="color:'+st.color+';background:'+st.bg+';">'+st.label+'</span></div>'
      + '<div class="cd-drtabbar">'
        + tab("overview","Overview")
        + tab("notes","Notes",(d.notesLog||[]).length)
        + tab("commitments","Commitments",dealCommitments.filter(c=>c.status==="open").length)
        + tab("tasks","Tasks",dealTasks.filter(t=>t.status==="open").length)
        + tab("legal","Legal")
        + tab("pending","Legacy",(d.pending||[]).filter(p=>!p.done).length)
      + '</div>'
      + body;
  }

  function wireDrawer(d){
    document.querySelectorAll("[data-drclose]").forEach(b=>b.onclick=closeDrawer);
    document.querySelectorAll("[data-drtab]").forEach(b=>b.onclick=()=>{ drawerTab=b.dataset.drtab; commitEditingId=null; taskEditingId=null; renderDrawer(dealById(drawerDealId)); });
    wireDatePickers(()=>renderDrawer(d));
    document.querySelectorAll("[data-sectiontoggle]").forEach(el=>el.onclick=()=>{
      const key = el.dataset.sectiontoggle;
      if(collapsedSections.has(key)) collapsedSections.delete(key); else collapsedSections.add(key);
      renderDrawer(d);
    });

    // Contact info
    document.querySelectorAll("[data-addcontact]").forEach(b=>b.onclick=()=>{
      drawerEditingContact = true;
      renderDrawer(d);
    });
    const saveContactBtn = document.getElementById("cdSaveContact");
    if(saveContactBtn) saveContactBtn.onclick = ()=>{
      const name = document.getElementById("cdContactName").value.trim();
      const phone = document.getElementById("cdContactPhone").value.trim();
      const email = document.getElementById("cdContactEmail").value.trim();
      d.contact = {name, phone, email};
      logEvent(d.name+": contact info added/updated", d.id);
      drawerEditingContact = false;
      save(); renderDrawer(d); render();
    };
    const cancelContactBtn = document.getElementById("cdCancelContact");
    if(cancelContactBtn) cancelContactBtn.onclick = ()=>{
      drawerEditingContact = false;
      renderDrawer(d);
    };

    // Ownership
    const ownerSel = document.querySelector("[data-ownerchange]");
    if(ownerSel) ownerSel.onchange = ()=>{
      d.owner = d.owner || {isOurs:true, ownerId:null, ownerName:""};
      const wasOurs = d.owner.isOurs;
      d.owner.isOurs = ownerSel.value==="ours";
      if(wasOurs && !d.owner.isOurs){
        // Close out (not delete) any open tasks/commitments — Yaakov doesn't want to see
        // this deal's work items anywhere once it's marked as someone else's.
        let cleared = 0;
        DB.tasks.filter(t=>t.dealId===d.id && t.status==="open").forEach(t=>{ t.status="done"; cleared++; });
        DB.commitments.filter(c=>c.dealId===d.id && c.status==="open").forEach(c=>{ c.status="fulfilled"; cleared++; });
        logEvent(d.name+": marked as not our deal (on our platform) — closed out "+cleared+" open task(s)/commitment(s)", d.id);
      } else {
        logEvent(d.name+": marked as "+(d.owner.isOurs?"our deal":"not our deal (on our platform)"), d.id);
      }
      save(); renderDrawer(d); render();
    };
    const ownerPickSel = document.querySelector("[data-ownerpick]");
    if(ownerPickSel) ownerPickSel.onchange = ()=>{
      if(ownerPickSel.value==="__new__"){
        addingOwnerFor = d.id;
        renderDrawer(d);
        return;
      }
      d.owner = d.owner || {isOurs:false, ownerId:null, ownerName:""};
      d.owner.ownerId = ownerPickSel.value || null;
      const o = DB.owners.find(x=>x.id===d.owner.ownerId);
      d.owner.ownerName = o ? o.name : "";
      logEvent(d.name+": owner set to "+(o?o.name:"none"), d.id);
      save(); renderDrawer(d); render();
    };
    const ownerCancelBtn = document.querySelector("[data-ownercancel]");
    if(ownerCancelBtn) ownerCancelBtn.onclick = ()=>{ addingOwnerFor = null; renderDrawer(d); };
    const ownerSaveBtn = document.querySelector("[data-ownersave]");
    if(ownerSaveBtn) ownerSaveBtn.onclick = ()=>{
      const name = document.getElementById("cdNewOwnerName").value.trim();
      if(!name){
        document.getElementById("cdNewOwnerName").style.borderColor = "var(--red)";
        return;
      }
      const newOwner = {id: uid("owner"), name};
      DB.owners = DB.owners || [];
      DB.owners.push(newOwner);
      d.owner = d.owner || {isOurs:false, ownerId:null, ownerName:""};
      d.owner.ownerId = newOwner.id;
      d.owner.ownerName = name;
      logEvent(d.name+": added owner "+name+" and linked", d.id);
      addingOwnerFor = null;
      save(); renderDrawer(d); render();
    };

    // Broker
    const brokerSel = document.querySelector("[data-brokerchange]");
    if(brokerSel) brokerSel.onchange = ()=>{
      if(brokerSel.value==="__new__"){
        addingBrokerFor = d.id;
        renderDrawer(d);
        return;
      }
      d.brokerId = brokerSel.value || null;
      const b = DB.brokers.find(x=>x.id===d.brokerId);
      logEvent(d.name+": broker set to "+(b?b.name:"none"), d.id);
      save(); renderDrawer(d); render();
    };
    const brokerCancelBtn = document.querySelector("[data-brokercancel]");
    if(brokerCancelBtn) brokerCancelBtn.onclick = ()=>{ addingBrokerFor = null; renderDrawer(d); };
    const brokerSaveBtn = document.querySelector("[data-brokersave]");
    if(brokerSaveBtn) brokerSaveBtn.onclick = ()=>{
      const name = document.getElementById("cdNewBrokerName").value.trim();
      if(!name){
        document.getElementById("cdNewBrokerName").style.borderColor = "var(--red)";
        return;
      }
      const phone = document.getElementById("cdNewBrokerPhone").value.trim();
      const email = document.getElementById("cdNewBrokerEmail").value.trim();
      const newBroker = {id: uid("broker"), name, phone, email};
      DB.brokers = DB.brokers || [];
      DB.brokers.push(newBroker);
      d.brokerId = newBroker.id;
      logEvent("Added broker "+name+" and linked to "+d.name, d.id);
      addingBrokerFor = null;
      save(); renderDrawer(d); render();
    };

    // Clawback
    const clawSel = document.querySelector("[data-clawback]");
    if(clawSel) clawSel.onchange = ()=>{
      d.clawback = clawSel.value;
      logEvent(d.name+": clawback state set to "+(CLAWBACK[clawSel.value]||{}).label, d.id);
      if(clawSel.value==="bounced" && !isOtherOwnerDeal(d)){
        DB.tasks.push({id:uid("task"), dealId:d.id, type:"iso_in_touch", waitingOn:"iso", stage:"open", description:"Clawback bounced — needs ISO to wire directly", dueDate:null, status:"open", createdDate:todayStr()});
        logEvent(d.name+": auto-created ISO In Touch task (clawback bounced)", d.id);
      }
      save(); render();
    };

    // Status change
    const statusSel = document.querySelector("[data-statuschange]");
    if(statusSel) statusSel.onchange = ()=>{
      const from = d.status;
      d.status = statusSel.value;
      d.statusLocked = true;
      logEvent(d.name+": moved from "+(statusOf(from).label)+" to "+(statusOf(d.status).label), d.id);
      save(); render();
    };

    // Notes
    function addNoteFromField(){
      const el = document.getElementById("cdNewNote");
      const txt = el.value.trim();
      if(!txt) return;
      d.notes = (d.notes?d.notes+"\n\n":"") + "["+todayStr()+"] "+txt;
      d.notesLog = d.notesLog || [];
      const now = new Date();
      d.notesLog.push({text:txt, stamp: now.toLocaleDateString("en-US",{month:"short",day:"numeric"})+" "+now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}), date:todayStr()});
      logEvent(d.name+": note added — \""+(txt.length>100?txt.slice(0,100)+"…":txt)+"\"", d.id);
      save(); renderDrawer(d); render();
    }
    const addNoteBtn = document.getElementById("cdAddNote");
    if(addNoteBtn) addNoteBtn.onclick = addNoteFromField;
    const newNoteEl = document.getElementById("cdNewNote");
    if(newNoteEl) newNoteEl.onkeydown = (e)=>{
      if((e.ctrlKey || e.metaKey) && e.key==="Enter"){ e.preventDefault(); addNoteFromField(); }
    };

    // Commitments
    const addCommitBtn = document.getElementById("cdAddCommit");
    if(addCommitBtn) addCommitBtn.onclick = ()=>{
      const desc = document.getElementById("cdNewCommitDesc").value.trim();
      const by = document.getElementById("cdNewCommitBy").value;
      const date = datePickerValues["newCommit"];
      const recur = parseInt(document.getElementById("cdNewCommitRecur").value, 10) || 0;
      if(!desc || !date){
        if(!desc) document.getElementById("cdNewCommitDesc").style.borderColor = "var(--red)";
        if(!date) document.querySelector('[data-datetoggle="newCommit"]').style.borderColor = "var(--red)";
        return;
      }
      const newCommit = {id:uid("commit"), dealId:d.id, description:desc, promisedBy:by, dueDate:date, status:"open", history:[], createdDate:todayStr()};
      if(recur) newCommit.recurrenceDays = recur;
      DB.commitments.push(newCommit);
      logEvent(d.name+": commitment added — "+desc+" (due "+date+")"+(recur?" — repeats every "+recur+" days":""), d.id);
      delete datePickerValues["newCommit"]; delete datePickerMonth["newCommit"]; datePickerOpenFor=null;
      save(); renderDrawer(d); render();
    };
    document.querySelectorAll("[data-commitfulfill]").forEach(b=>b.onclick=()=>{
      const c = DB.commitments.find(x=>x.id===b.dataset.commitfulfill);
      if(!c) return;
      c.status="fulfilled";
      let logMsg = d.name+": commitment fulfilled — "+c.description;
      if(c.recurrenceDays){
        const nextDue = addDays(c.dueDate, c.recurrenceDays);
        DB.commitments.push({id:uid("commit"), dealId:c.dealId, description:c.description, promisedBy:c.promisedBy, dueDate:nextDue, status:"open", history:[], createdDate:todayStr(), recurrenceDays:c.recurrenceDays});
        logMsg += " — next check-in auto-scheduled for "+fmtDateShort(nextDue);
      }
      logEvent(logMsg, d.id);
      save(); renderDrawer(d); render();
    });
    document.querySelectorAll("[data-commitedit]").forEach(b=>b.onclick=()=>{
      commitEditingId = b.dataset.commitedit;
      const c = DB.commitments.find(x=>x.id===commitEditingId);
      if(c) datePickerValues["editCommit-"+commitEditingId] = c.dueDate;
      renderDrawer(d);
    });
    document.querySelectorAll("[data-commitcancel]").forEach(b=>b.onclick=()=>{
      if(commitEditingId){ delete datePickerValues["editCommit-"+commitEditingId]; delete datePickerMonth["editCommit-"+commitEditingId]; }
      commitEditingId = null;
      datePickerOpenFor = null;
      renderDrawer(d);
    });
    document.querySelectorAll("[data-commitsave]").forEach(b=>b.onclick=()=>{
      const cid = b.dataset.commitsave;
      const c = DB.commitments.find(x=>x.id===cid);
      if(!c) return;
      const newDesc = document.getElementById("cdEditCommitDesc-"+cid).value.trim();
      const newBy = document.getElementById("cdEditCommitBy-"+cid).value;
      const newDate = datePickerValues["editCommit-"+cid];
      if(!newDesc || !newDate){
        if(!newDesc) document.getElementById("cdEditCommitDesc-"+cid).style.borderColor = "var(--red)";
        if(!newDate) document.querySelector('[data-datetoggle="editCommit-'+cid+'"]').style.borderColor = "var(--red)";
        return;
      }
      const changes = [];
      if(newDesc !== c.description) changes.push("description updated");
      if(newBy !== c.promisedBy) changes.push("promised by changed from "+WAITING_ON[c.promisedBy]+" to "+WAITING_ON[newBy]);
      if(newDate !== c.dueDate) changes.push("due date changed from "+fmtDateShort(c.dueDate)+" to "+fmtDateShort(newDate));
      if(changes.length){
        c.history = c.history || [];
        c.history.push({date:todayStr(), note:changes.join("; ")});
        c.description = newDesc; c.promisedBy = newBy; c.dueDate = newDate;
        logEvent(d.name+": commitment edited — "+changes.join("; "), d.id);
      }
      delete datePickerValues["editCommit-"+cid]; delete datePickerMonth["editCommit-"+cid]; datePickerOpenFor=null;
      commitEditingId = null;
      save(); renderDrawer(d); render();
    });
    document.querySelectorAll("[data-commitbreak]").forEach(b=>b.onclick=()=>{
      const c = DB.commitments.find(x=>x.id===b.dataset.commitbreak);
      if(!c) return;
      c.status = "broken";
      if(!isOtherOwnerDeal(d)){
        DB.tasks.push({id:uid("task"), dealId:d.id, type: c.promisedBy==="iso"?"iso_in_touch":c.promisedBy==="merchant"?"contact_merchant":"internal_followup", waitingOn:c.promisedBy, stage:"open", description:"Broken commitment: "+c.description, dueDate:null, status:"open", createdDate:todayStr()});
        logEvent(d.name+": commitment marked broken — "+c.description+" (auto-created follow-up task)", d.id);
      } else {
        logEvent(d.name+": commitment marked broken — "+c.description, d.id);
      }
      save(); renderDrawer(d); render();
    });

    // Tasks
    const addTaskBtn = document.getElementById("cdAddTask");
    if(addTaskBtn) addTaskBtn.onclick = ()=>{
      const type = document.getElementById("cdNewTaskType").value;
      const waitingOn = document.getElementById("cdNewTaskWaiting").value;
      const desc = document.getElementById("cdNewTaskDesc").value.trim();
      const date = datePickerValues["newTask"] || null;
      DB.tasks.push({id:uid("task"), dealId:d.id, type, waitingOn, stage:"open", description:desc, dueDate:date, status:"open", createdDate:todayStr()});
      logEvent(d.name+": task added — "+(TASK_TYPES[type]||type)+" (waiting on "+(WAITING_ON[waitingOn]||waitingOn)+")", d.id);
      delete datePickerValues["newTask"]; delete datePickerMonth["newTask"]; datePickerOpenFor=null;
      save(); renderDrawer(d); render();
    };
    document.querySelectorAll("[data-taskcompletebox]").forEach(cb=>cb.onchange=()=>{
      const t = DB.tasks.find(x=>x.id===cb.dataset.taskcompletebox);
      if(t){ t.status="done"; logEvent(d.name+": task completed — "+(TASK_TYPES[t.type]||t.type), d.id); save(); renderDrawer(d); render(); }
    });
    document.querySelectorAll("[data-taskedit]").forEach(b=>b.onclick=()=>{
      taskEditingId = b.dataset.taskedit;
      const t = DB.tasks.find(x=>x.id===taskEditingId);
      if(t) datePickerValues["editTask-"+taskEditingId] = t.dueDate;
      renderDrawer(d);
    });
    document.querySelectorAll("[data-taskcancel]").forEach(b=>b.onclick=()=>{
      if(taskEditingId){ delete datePickerValues["editTask-"+taskEditingId]; delete datePickerMonth["editTask-"+taskEditingId]; }
      taskEditingId = null;
      datePickerOpenFor = null;
      renderDrawer(d);
    });
    document.querySelectorAll("[data-tasksave]").forEach(b=>b.onclick=()=>{
      const tid = b.dataset.tasksave;
      const t = DB.tasks.find(x=>x.id===tid);
      if(!t) return;
      const newType = document.getElementById("cdEditTaskType-"+tid).value;
      const newWaiting = document.getElementById("cdEditTaskWaiting-"+tid).value;
      const newDesc = document.getElementById("cdEditTaskDesc-"+tid).value.trim();
      const newDate = datePickerValues["editTask-"+tid] || null;
      const changes = [];
      if(newType!==t.type) changes.push("type changed to "+TASK_TYPES[newType]);
      if(newWaiting!==t.waitingOn) changes.push("now waiting on "+WAITING_ON[newWaiting]);
      if(newDesc!==t.description) changes.push("description updated");
      if(newDate!==t.dueDate) changes.push("due date changed to "+(newDate?fmtDateShort(newDate):"none"));
      t.type=newType; t.waitingOn=newWaiting; t.description=newDesc; t.dueDate=newDate;
      if(changes.length) logEvent(d.name+": task edited — "+changes.join("; "), d.id);
      delete datePickerValues["editTask-"+tid]; delete datePickerMonth["editTask-"+tid]; datePickerOpenFor=null;
      taskEditingId = null;
      save(); renderDrawer(d); render();
    });

    // Legal
    const startLegalBtn = document.getElementById("cdStartLegal");
    if(startLegalBtn) startLegalBtn.onclick = ()=>{
      d.legalCase = {
        firm:"Madeb Law", track:"madeb", stage:"assembling_packet", filedDate:null, lastContactDate:todayStr(),
        snoozeWeeks:0, caseStatusLegacy:"",
        docs:{statements:"pending",application:"pending",dlvc:"pending",ucc:"pending",wireScreenshot:"pending",payrunScreenshot:"pending",pdfPayrun:"pending",arInvoices:"pending",settlementAgreement:"pending"},
        needsReview:false
      };
      logEvent(d.name+": legal case started", d.id);
      save(); renderDrawer(d); render();
    };
    const firmSelectEl = document.getElementById("cdLegalFirmSelect");
    if(firmSelectEl) firmSelectEl.onchange = ()=>{
      const chosen = firmSelectEl.value;
      d.legalCase.track = KNOWN_FIRMS[chosen];
      d.legalCase.firm = chosen==="Other" ? "" : chosen;
      logEvent(d.name+": legal firm set to "+chosen, d.id);
      save(); renderDrawer(d); render();
    };
    const firmOtherEl = document.getElementById("cdLegalFirmOther");
    if(firmOtherEl) firmOtherEl.onchange = ()=>{
      d.legalCase.firm = firmOtherEl.value;
      save(); render();
    };
    const stageEl = document.getElementById("cdLegalStage");
    if(stageEl) stageEl.onchange = ()=>{
      d.legalCase.stage = stageEl.value;
      logEvent(d.name+": legal stage moved to "+(LEGAL_STAGES[stageEl.value]||{}).label, d.id);
      save(); renderDrawer(d); render();
    };
    document.querySelectorAll("[data-legalcontacttoday]").forEach(b=>b.onclick=()=>{
      d.legalCase.lastContactDate = todayStr();
      d.legalCase.snoozeWeeks = 0;
      logEvent(d.name+": logged legal contact today", d.id);
      save(); renderDrawer(d); render();
    });
    const snoozeEl = document.getElementById("cdLegalSnooze");
    if(snoozeEl) snoozeEl.onchange = ()=>{
      const wk = parseInt(snoozeEl.value,10);
      if(wk>0){
        d.legalCase.snoozeWeeks = (d.legalCase.snoozeWeeks||0) + wk;
        logEvent(d.name+": legal follow-up snoozed "+wk+" more week(s)", d.id);
        save(); renderDrawer(d); render();
      }
    };
    document.querySelectorAll("[data-doctoggle]").forEach(b=>b.onclick=()=>{
      const [dealId, docKey, val] = b.dataset.doctoggle.split("|");
      const deal = dealById(dealId);
      const current = deal.legalCase.docs[docKey];
      deal.legalCase.docs[docKey] = current===val ? "pending" : val;
      const nowMissing = deal.legalCase.docs[docKey]==="pending";
      logEvent(deal.name+": "+LEGAL_DOC_LABELS[docKey]+" marked "+(nowMissing?"missing":deal.legalCase.docs[docKey]), dealId);
      syncMissingDocTask(deal, docKey, nowMissing);
      save(); renderDrawer(deal); render();
    });
  }

  // A missing legal doc gets its own follow-up task, due tomorrow, so it shows on the
  // calendar exactly like Yaakov described — "reminder like this file was missing from
  // the deal". Once the doc is marked Sent or N/A, that task auto-resolves.
  function tomorrowStr(){
    const t = new Date(TODAY); t.setDate(t.getDate()+1);
    return t.toISOString().slice(0,10);
  }
  function missingDocTaskDesc(docKey){ return "Missing: "+LEGAL_DOC_LABELS[docKey]; }
  function syncMissingDocTask(deal, docKey, nowMissing){
    const desc = missingDocTaskDesc(docKey);
    const existing = DB.tasks.find(t=>t.dealId===deal.id && t.status==="open" && t.type==="legal_followup" && t.description===desc);
    if(nowMissing && !existing){
      DB.tasks.push({id:uid("task"), dealId:deal.id, type:"legal_followup", waitingOn:"legal_firm", stage:"open", description:desc, dueDate:tomorrowStr(), status:"open", createdDate:todayStr()});
      logEvent(deal.name+": follow-up reminder set for tomorrow — "+desc, deal.id);
    } else if(!nowMissing && existing){
      existing.status = "done";
      logEvent(deal.name+": follow-up reminder cleared — "+desc+" received", deal.id);
    }
  }

  // ---------------- REPORTS: generation & export ----------------
  async function generateReport(){
    const since = DB.lastReportAt;
    const events = (DB.eventLog||[]).filter(e=> !since || e.date >= since);
    const genBtn = document.getElementById("cdGenReport");
    const spinner = document.getElementById("cdReportGenerating");
    const outEl = document.getElementById("cdReportOutput");

    if(!events.length){
      outEl.innerHTML = '<p class="cd-caption">Nothing logged '+(since?'since the last report.':'yet.')+'</p>';
      DB.lastReportAt = todayStr(); await save(); return;
    }

    genBtn.disabled = true; spinner.style.display = "inline"; outEl.innerHTML = "";

    const touchedIds = [...new Set(events.map(e=>e.dealId).filter(Boolean))];
    const dealContext = touchedIds.map(id=>{
      const d = dealById(id);
      if(!d) return null;
      const idBits = [d.mcht, d.leadId?("Lead "+d.leadId):null].filter(Boolean).join(" · ");
      return "- "+d.name+(idBits?" ("+idBits+")":"")+" — status: "+statusOf(d.status).label+", remaining: "+money(Math.max(0,(d.original||0)-(d.recovered||0)));
    }).filter(Boolean).join("\n");
    const logText = events.map(e=>"["+(e.stamp||e.date)+"] "+e.text).join("\n");

    const prompt = "Write a collections update for David, the owner of an MCA funding company, from his collections person. "
      + "Make it sound like a real person wrote it: plain, easy to read, human — not a generic AI summary. Group loosely under themes if it helps "
      + "(filed/legal, escalations, resolved, new deals, other) but don't force rigid headers if the update is short. No hyphens or em dashes. "
      + "Always include MCHT/lead ID when mentioning a deal, using the context below. Don't invent facts not in the log.\n\n"
      + "DEAL CONTEXT:\n" + (dealContext||"(none)") + "\n\nRAW LOG:\n" + logText;

    try{
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({model:"claude-sonnet-4-6", max_tokens:1000, messages:[{role:"user", content:prompt}]})
      });
      const data = await response.json();
      const text = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
      if(!text) throw new Error("empty");
      outEl.innerHTML = '<div class="cd-drsect" style="margin-top:14px;">Report'+(since?' since '+since:' — full history')+'</div>'
        + '<textarea class="cd-note" readonly style="min-height:220px;" onclick="this.select()">'+esc(text)+'</textarea>'
        + '<p class="cd-caption" style="margin-top:6px;">Click to select all, then copy.</p>';
    } catch(err){
      outEl.innerHTML = '<p class="cd-warn">Couldn\'t reach the summary writer. Raw log:</p>'
        + events.map(e=>'<div class="cd-logrow"><span>'+esc(e.stamp||e.date)+'</span><span>'+esc(e.text)+'</span></div>').join("");
    } finally {
      genBtn.disabled = false; spinner.style.display = "none";
    }
    DB.lastReportAt = todayStr(); await save();
  }

  // Where each number actually comes from, and where it doesn't. Written down because
  // reading a stale or incomplete source is how wrong calls get made — a deal can look
  // current in one system and be days behind in another.
  function dataSourcesHtml(){
    const rows = [
      ["LendSaaS — Breeze", "Live and readable. Breeze deals only.",
       "Read-only. Any change (recurrence, pause, clawback pull, record edit) is routed to Gabriela or Anusha, never made directly."],
      ["LendSaaS — Emberstone", "Separate instance. NOT connected.",
       "Emberstone deals have to be supplied by hand. Don't look them up and don't assume the Breeze instance covers them."],
      ["MCATrack / Legacy", "Not connected, and these deals aren't in LendSaaS either.",
       "The Legacy-platform deals have no lead ID and can't get one from LendSaaS. Their data comes from ACHWorks and MCATrack email only."],
      ["MCA Pay", "Deals exist in LendSaaS, but the LendSaaS view is NOT authoritative.",
       "Payments are logged into LendSaaS by hand, so it lags. Bounces never appear there at all — only MCA Pay reports them. A LendSaaS balance on an MCA Pay deal can look healthier than reality."],
      ["Gmail", "Connected, with one hard limit.",
       "Search returns only the five OLDEST messages of a thread and there's no way to fetch the newest. On long threads the current state is invisible — screenshot the last message instead."]
    ];
    const counts = {};
    (DB.deals||[]).forEach(d=>{ if(!isOtherOwnerDeal(d)) counts[d.platform] = (counts[d.platform]||0)+1; });
    return '<div class="cd-panel" style="margin-top:16px;"><h3>Where the data comes from</h3>'
      + '<p class="cd-caption">Current book: '
      + Object.keys(counts).sort().map(k=>esc(k)+" "+counts[k]).join(" \u00B7 ")
      + '</p>'
      + rows.map(r=>'<div style="border-top:1px solid var(--line);padding:10px 0;">'
          + '<div><b>'+esc(r[0])+'</b> \u2014 '+esc(r[1])+'</div>'
          + '<div class="cd-caption" style="margin-top:3px;">'+esc(r[2])+'</div></div>').join("")
      + '</div>';
  }

  function saveSnapshot(){
    // May be called from the storage-failure banner while some other page is open,
    // in which case there's no output element to write status into.
    const outEl = document.getElementById("cdExportOutput") || {set innerHTML(v){}};
    const text = JSON.stringify(DB, null, 2);
    const filename = "collections-hq-snapshot-"+todayStr()+".json";
    try{
      const blob = new Blob([text], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      outEl.innerHTML = '<p class="cd-caption" style="margin-top:10px;color:var(--green);">Saved as '+esc(filename)+' — check your Downloads folder. Drag that file into a chat with Claude any time to hand off everything currently in this app.</p>';
    } catch(e){
      // Download blocked for some reason — fall back to a copyable textarea so nothing is lost
      outEl.innerHTML = '<p class="cd-caption" style="margin-top:10px;color:var(--yellow);">Download didn\'t go through — here\'s the data to copy manually instead:</p>'
        + '<textarea class="cd-note" readonly style="min-height:160px;margin-top:6px;" onclick="this.select()">'+esc(text)+'</textarea>';
    }
  }

  // ---------------- QUICK TASK MODAL ----------------
  let quickTaskDealId = null;
  let quickTaskSearch = "";

  function openQuickTaskModal(){
    quickTaskDealId = null;
    quickTaskSearch = "";
    delete datePickerValues["quickTask"]; delete datePickerMonth["quickTask"]; datePickerOpenFor=null;
    renderQuickTaskModal();
    document.getElementById("cdModalOverlay").classList.add("on");
  }
  function closeQuickTaskModal(){
    delete datePickerValues["quickTask"]; delete datePickerMonth["quickTask"]; datePickerOpenFor=null;
    document.getElementById("cdModalOverlay").classList.remove("on");
  }

  function renderQuickTaskModal(){
    const picked = quickTaskDealId ? dealById(quickTaskDealId) : null;
    const matches = quickTaskSearch.length
      ? DB.deals.filter(d=>(d.name||"").toLowerCase().includes(quickTaskSearch.toLowerCase()) || (d.mcht||"").toLowerCase().includes(quickTaskSearch.toLowerCase())).slice(0,8)
      : [];

    let html = '<button class="cd-modalclose" id="cdModalClose">×</button>'
      + '<h3>New Task</h3>'
      + '<div class="cd-drsect" style="margin-top:0;">Deal</div>';

    if(picked){
      html += '<div class="cd-dealpickrow picked">'+esc(picked.name)+' <button class="cd-inlinebtn" id="cdQuickTaskChangeDeal" style="margin-left:8px;">Change</button></div>';
    } else {
      html += '<input class="cd-search" id="cdQuickTaskSearch" placeholder="Search deal by name or MCHT..." value="'+esc(quickTaskSearch)+'" style="max-width:none;">'
        + (matches.length ? '<div class="cd-dealpick">'+matches.map(d=>'<div class="cd-dealpickrow" data-quickpick="'+d.id+'">'+esc(d.name)+' <span style="color:var(--ink-faint);">'+esc(d.mcht||"")+'</span></div>').join("")+'</div>' : (quickTaskSearch?'<p class="cd-caption">No matches.</p>':''));
    }

    if(picked){
      html += '<div class="cd-drsect">Details</div>'
        + '<select class="cd-select" id="cdQuickTaskType" style="margin-bottom:6px;">'+Object.keys(TASK_TYPES).map(k=>'<option value="'+k+'">'+TASK_TYPES[k]+'</option>').join("")+'</select>'
        + '<select class="cd-select" id="cdQuickTaskWaiting" style="margin-bottom:6px;">'+Object.keys(WAITING_ON).map(k=>'<option value="'+k+'">Waiting on '+WAITING_ON[k]+'</option>').join("")+'</select>'
        + '<input class="cd-note" id="cdQuickTaskDesc" placeholder="Details (optional)" style="min-height:auto;padding:8px 10px;margin-bottom:6px;">'
        + dateFieldHtml("quickTask")
        + '<button class="cd-savebtn" id="cdQuickTaskAdd">Add Task</button>';
    }

    document.getElementById("cdModal").innerHTML = html;
    wireQuickTaskModal();
  }

  function wireQuickTaskModal(){
    const closeBtn = document.getElementById("cdModalClose");
    if(closeBtn) closeBtn.onclick = closeQuickTaskModal;
    wireDatePickers(renderQuickTaskModal);
    const searchEl = document.getElementById("cdQuickTaskSearch");
    if(searchEl){
      searchEl.oninput = ()=>{ quickTaskSearch = searchEl.value; renderQuickTaskModal(); const el=document.getElementById("cdQuickTaskSearch"); if(el){ el.focus(); el.selectionStart=el.value.length; } };
    }
    document.querySelectorAll("[data-quickpick]").forEach(el=>el.onclick=()=>{ quickTaskDealId = el.dataset.quickpick; renderQuickTaskModal(); });
    const changeBtn = document.getElementById("cdQuickTaskChangeDeal");
    if(changeBtn) changeBtn.onclick = ()=>{ quickTaskDealId = null; renderQuickTaskModal(); };
    const addBtn = document.getElementById("cdQuickTaskAdd");
    if(addBtn) addBtn.onclick = async ()=>{
      const d = dealById(quickTaskDealId);
      if(!d) return;
      const type = document.getElementById("cdQuickTaskType").value;
      const waitingOn = document.getElementById("cdQuickTaskWaiting").value;
      const desc = document.getElementById("cdQuickTaskDesc").value.trim();
      const date = datePickerValues["quickTask"] || null;
      DB.tasks.push({id:uid("task"), dealId:d.id, type, waitingOn, stage:"open", description:desc, dueDate:date, status:"open", createdDate:todayStr()});
      logEvent(d.name+": task added — "+(TASK_TYPES[type]||type)+" (waiting on "+(WAITING_ON[waitingOn]||waitingOn)+")", d.id);
      delete datePickerValues["quickTask"]; delete datePickerMonth["quickTask"]; datePickerOpenFor=null;
      await save();
      closeQuickTaskModal();
      render();
    };
  }
})();
</script>
